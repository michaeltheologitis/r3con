name: Mac app

# Signed ad hoc unless `sign` is set: only a run on main or a v* tag, through the
# macos-signing environment, gets the signing key.
on:
  pull_request:
    paths:
      - "src/r3con/**"
      - "icons/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/app/bundle_check.py"
      - ".github/briefcase/**"
      - ".github/actions/sparkle/**"
      - ".github/workflows/mac-app.yml"
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarize
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign:
        type: boolean
        default: false
      # The release's, for its update feed.
      notes:
        type: string
        default: ""
    secrets:
      MACOS_CERTIFICATE: {required: false}
      MACOS_CERTIFICATE_PASSWORD: {required: false}
      APP_STORE_CONNECT_KEY: {required: false}
      APP_STORE_CONNECT_KEY_ID: {required: false}
      APP_STORE_CONNECT_ISSUER_ID: {required: false}
      SPARKLE_PRIVATE_KEY: {required: false}

permissions:
  contents: read

concurrency:
  # Not github.workflow, which in a workflow_call is the caller's, and so its group.
  group: mac-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Otherwise importing litellm fetches its price map from GitHub.
  LITELLM_LOCAL_MODEL_COST_MAP: "True"
  # uv.lock's pins and hashes, for the bundle and for the backend that builds it.
  CONSTRAINTS: build/constraints.txt
  BUILD_CONSTRAINTS: build/build-constraints.txt
  # Where pyproject.toml's requirement_installer_args has pip find every wheel.
  WHEELS: build/wheels
  # The bundle's own Python, in the app.
  APP_PYTHON: Contents/Frameworks/Python.framework/Versions/3.14/bin/python3

jobs:
  app:
    runs-on: macos-15
    # A signed run can wait up to two hours for each of Apple's two notarizations.
    timeout-minutes: ${{ inputs.sign && 270 || 30 }}
    # An empty name is no environment: no approval and no secrets.
    environment: ${{ inputs.sign && 'macos-signing' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.7"
          # The release's uv-aarch64-apple-darwin.tar.gz.sha256.
          checksum: 81b811b57e4624df7ed3aac148e0359100d9962f3d9dce00aec533dc2e086731
          enable-cache: false
      # The bundle's packages and the backend that builds this project, at uv.lock's
      # versions (the ones the Linux CI tests) and hashes.
      # --locked fails here if uv.lock is out of date with pyproject.toml.
      - name: Pin the bundle and its build to uv.lock
        run: |
          uv export --locked --no-dev --extra app --group mac-app --no-emit-project --output-file "$CONSTRAINTS"
          uv export --locked --only-group build-backend --no-emit-project --output-file "$BUILD_CONSTRAINTS"
      - name: Install Briefcase from its own uv.lock, by hash
        run: |
          uv export --project .github/briefcase --locked --no-emit-project --output-file "$RUNNER_TEMP/briefcase.txt"
          uv venv --python 3.14 "$RUNNER_TEMP/briefcase"
          uv pip install --python "$RUNNER_TEMP/briefcase" --require-hashes --only-binary :all: -r "$RUNNER_TEMP/briefcase.txt"
      # With the Python and platform tag of Briefcase's pip (arm64, and its support
      # package's minimum macOS, 11.0), so that pip picks the wheels Briefcase's would.
      - name: Download the bundle's wheels, by uv.lock's hashes
        run: '"$RUNNER_TEMP/briefcase/bin/python" -m pip download --require-hashes --only-binary :all: --no-deps --platform macosx_11_0_arm64 --dest "$WHEELS" -r "$CONSTRAINTS" -r "$BUILD_CONSTRAINTS"'
      # Its CFBundleVersion, which Sparkle compares with the feed's to find a newer
      # release, is the project's version, not Briefcase's default, 1.
      - name: Build the app
        id: build
        run: |
          version=$(uv version --short)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          "$RUNNER_TEMP/briefcase/bin/briefcase" build macOS app --config "build='$version'" --no-input
      - uses: ./.github/actions/sparkle
        id: sparkle
      # Before the app is signed. It isn't sandboxed, so it enables none of Sparkle's XPC
      # services, which Sparkle's docs then let it drop. Sparkle's licence goes with it.
      - name: Add Sparkle to the app
        env:
          SPARKLE: ${{ steps.sparkle.outputs.path }}
        run: |
          framework="$SPARKLE/Sparkle.framework"
          rm -r "$framework/XPCServices" "$framework/Versions/B/XPCServices"
          cp "$SPARKLE/LICENSE" "$framework/Versions/B/Resources/LICENSE"
          ditto "$framework" "$(echo build/r3con/macos/app/*.app)/Contents/Frameworks/Sparkle.framework"
      # So that a run without SPARKLE_PRIVATE_KEY makes and checks its feed as a release
      # does; before signing, which seals Info.plist.
      - name: Make a throwaway update key for the app
        if: ${{ !inputs.sign }}
        run: |
          app=$(echo build/r3con/macos/app/*.app)
          umask 077
          public=$("$app/$APP_PYTHON" -I -B -c '
          import site, sys
          from base64 import b64encode
          from pathlib import Path
          site.addsitedir(sys.argv[1])
          from Crypto.PublicKey import ECC
          key = ECC.generate(curve="Ed25519")
          Path(sys.argv[2]).write_text(b64encode(key.seed).decode())
          print(b64encode(key.public_key().export_key(format="raw")).decode())
          ' "$app/Contents/Resources/app_packages" "$RUNNER_TEMP/update-key")
          plutil -replace SUPublicEDKey -string "$public" "$app/Contents/Info.plist"
      # After the build, so that the key is absent while pip and the build backend run.
      - name: Import the Developer ID certificate into a keychain of its own
        if: inputs.sign
        id: identity
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          certificate="$RUNNER_TEMP/certificate.p12"
          password=$(openssl rand -base64 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode -o "$certificate"
          security import "$certificate" -k "$keychain" -f pkcs12 -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # shellcheck disable=SC2046 # One argument for each keychain already on the list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -F '"Developer ID Application: ' | grep -F "($TEAM_ID)\"" || true)
          if [ -z "$TEAM_ID" ] || [ "$(printf '%s' "$identity" | grep -c .)" -ne 1 ]; then
            echo "::error::No single valid Developer ID Application identity for team '$TEAM_ID' in the certificate."
            security find-identity -p codesigning "$keychain"
            exit 1
          fi
          echo "sha1=$(echo "$identity" | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "name=$(echo "$identity" | sed -E 's/^[^"]*"(.*)"$/\1/')" >> "$GITHUB_OUTPUT"
      # patched_briefcase.py signs Sparkle's code as Sparkle's docs do, and the rest as Briefcase does.
      - name: Package the app and its .dmg
        if: ${{ !inputs.sign }}
        run: '"$RUNNER_TEMP/briefcase/bin/python" -I .github/briefcase/patched_briefcase.py package macOS app --adhoc-sign --no-input'
      # Signed, the app is stapled before it is packed, so that it keeps a ticket out of the .dmg.
      - name: Sign the app and zip it
        if: inputs.sign
        env:
          IDENTITY: ${{ steps.identity.outputs.sha1 }}
        run: '"$RUNNER_TEMP/briefcase/bin/python" -I .github/briefcase/patched_briefcase.py package macOS app --packaging-format zip --identity "$IDENTITY" --no-notarize --no-input'
      - name: Notarize the app and staple its ticket
        if: inputs.sign
        id: notarize-app
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: .github/notarize.sh dist/*.app.zip build/r3con/macos/app/*.app
      # Briefcase signs the app again before packing it, which would invalidate its ticket.
      - name: Pack the app into a signed .dmg
        if: inputs.sign
        env:
          IDENTITY: ${{ steps.identity.outputs.sha1 }}
        run: '"$RUNNER_TEMP/briefcase/bin/python" -I .github/briefcase/patched_briefcase.py --keep-signature package macOS app --identity "$IDENTITY" --no-notarize --no-input'
      - name: Notarize the .dmg and staple its ticket
        if: inputs.sign
        id: notarize
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: .github/notarize.sh dist/*.dmg
      # Before the checks run the app's own code.
      - name: Remove the signing keychain and the API key
        if: always() && inputs.sign
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary-key.p8"
          if [ -e "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi
      # The asset name the feed's download URL ends with; a rename keeps signature and ticket.
      - name: Name the .dmg R3Con.dmg
        run: mv dist/R3Con-*.dmg dist/R3Con.dmg
      # generate_appcast signs the .dmg only if the app's SUPublicEDKey is the key's public
      # half, and else just warns (generate_appcast/Appcast.swift): its edSignature and
      # sign_update's check of the feed show both are signed by the key the app trusts.
      - name: Make the update feed
        env:
          SPARKLE: ${{ steps.sparkle.outputs.path }}
          SIGNED: ${{ inputs.sign }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          NOTES: ${{ inputs.notes }}
          DOWNLOADS: https://github.com/${{ github.repository }}/releases/download/v${{ steps.build.outputs.version }}/
        run: |
          if [ "$SIGNED" = true ]; then
            key=$SPARKLE_PRIVATE_KEY
            if [ -z "$key" ]; then
              echo "::error::macos-signing has no SPARKLE_PRIVATE_KEY."
              exit 1
            fi
          else
            key=$(cat "$RUNNER_TEMP/update-key")
            rm "$RUNNER_TEMP/update-key"
            echo "::add-mask::$key"
            # No release, no notes: these stand in, so that the feed embeds some.
            NOTES=${NOTES:-"**Sample notes.** A run that isn't signed embeds these in its feed."}
          fi
          feed="$RUNNER_TEMP/feed"
          # The .dmg alone: one update, no deltas.
          mkdir "$feed"
          cp -c dist/R3Con.dmg "$feed/"
          # Empty notes, as from a body of only trailers: no file, so the update has none.
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > "$feed/R3Con.md"
          fi
          printf '%s\n' "$key" | "$SPARKLE/bin/generate_appcast" --ed-key-file - --download-url-prefix "$DOWNLOADS" --embed-release-notes -o dist/appcast.xml "$feed"
          printf '%s\n' "$key" | "$SPARKLE/bin/sign_update" --verify --ed-key-file - dist/appcast.xml
          if ! grep -F 'sparkle:edSignature=' dist/appcast.xml; then
            echo "::error::The feed's .dmg is unsigned: the key isn't the one the app trusts."
            exit 1
          fi
      # As a user would: out of the .dmg, into a folder they can write to.
      - name: Install the app from its .dmg
        run: |
          mkdir -p "$RUNNER_TEMP/dmg" "$HOME/Applications"
          hdiutil attach dist/*.dmg -readonly -nobrowse -mountpoint "$RUNNER_TEMP/dmg"
          ditto "$RUNNER_TEMP/dmg/R3Con.app" "$HOME/Applications/R3Con.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
          echo "APP=$HOME/Applications/R3Con.app" >> "$GITHUB_ENV"
      - name: Check the app's signature
        run: |
          codesign --display --verbose=2 "$APP" 2>&1 | grep -E '^(Authority|Signature|Timestamp|TeamIdentifier)=|flags=' | tee "$RUNNER_TEMP/codesign.txt"
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tee -a "$RUNNER_TEMP/codesign.txt"
      - name: Check that Gatekeeper accepts the app and the .dmg as notarized
        if: inputs.sign
        run: |
          dmg=$(echo dist/*.dmg)
          checks="$RUNNER_TEMP/spctl-and-stapler.txt"
          spctl --assess --type execute --verbose=4 "$APP" 2>&1 | tee "$checks"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg" 2>&1 | tee -a "$checks"
          xcrun stapler validate "$APP" 2>&1 | tee -a "$checks"
          xcrun stapler validate "$dmg" 2>&1 | tee -a "$checks"
          if [ "$(grep -cx 'source=Notarized Developer ID' "$checks")" -ne 2 ]; then
            echo "::error::Gatekeeper did not accept both the app and the .dmg as notarized."
            exit 1
          fi
      # -B: bytecode written into the bundle would break its signature. Bounded, as a
      # Keychain dialog would wait for a click no one makes.
      - name: Check the bundle with its own Python
        timeout-minutes: 10
        run: '"$APP/$APP_PYTHON" -I -B tests/app/bundle_check.py "$APP" "$CONSTRAINTS" "$BUILD_CONSTRAINTS"'
      # Without its icon, Briefcase falls back to its placeholder and only says so.
      - name: Check that the app's icon is icons/r3con.icns
        run: cmp icons/r3con.icns "$APP/Contents/Resources/$(plutil -extract CFBundleIconFile raw "$APP/Contents/Info.plist")"
      # At INFO, so that the log shows Sparkle's updater started.
      - name: Open the app's window
        run: |
          launched=$(date '+%Y-%m-%d %H:%M:%S')
          R3CON_LOG_LEVEL=INFO "$APP/Contents/MacOS/R3Con" &
          pid=$!
          port=
          for _ in $(seq 60); do
            port=$(lsof -nP -a -p "$pid" -iTCP -sTCP:LISTEN -Fn | sed -n 's/^n.*://p' || true)
            [ -n "$port" ] && break
            sleep 1
          done
          if [ -z "$port" ]; then
            echo "::error::The app served nothing within 60 s."
            exit 1
          fi
          # The page stores its settings by its origin, so every launch takes the same port.
          own=$("$APP/$APP_PYTHON" -I -B -c '
          import site, sys
          sys.path.append(sys.argv[1])
          site.addsitedir(sys.argv[2])
          from r3con.app.window import PORT
          print(PORT)
          ' "$APP/Contents/Resources/app" "$APP/Contents/Resources/app_packages")
          if [ "$port" != "$own" ]; then
            echo "::error::The app serves on port $port, not on its own, $own."
            exit 1
          fi
          curl -fsS "http://127.0.0.1:$port/" | grep "<title>"
          # Only the window's page asks for /api/keys with the token. The app's stdout and
          # stderr, where uvicorn logs each request and r3con its lines, go to the
          # system log: here, all of it since the launch.
          keys='"GET /api/keys HTTP/1.1" 200'
          logged=
          for _ in $(seq 30); do
            logged=$(log show --start "$launched" --style compact --predicate 'process == "R3Con"')
            grep -qF "$keys" <<< "$logged" && break
            sleep 2
          done
          if ! grep -F "$keys" <<< "$logged"; then
            echo "::error::The window's page never asked the server for /api/keys with the token."
            exit 1
          fi
          # Before the page loads: Sparkle's error when its updater can't start, then r3con's line.
          if ! grep -F "Sparkle's updater started" <<< "$logged" || grep -F 'Fatal updater error' <<< "$logged"; then
            echo "::error::The app didn't start Sparkle's updater."
            exit 1
          fi
          screencapture -x "$RUNNER_TEMP/window.png" || echo "::warning::No screenshot."
          # Quit as the Dock's Quit or a logout asks: the app must stop its server before it ends.
          gone() { case "$(ps -o stat= -p "$pid")" in "" | Z*) return 0 ;; *) return 1 ;; esac; }
          started=$(date +%s)
          osascript -l JavaScript -e "ObjC.import('AppKit'); \$.NSRunningApplication.runningApplicationWithProcessIdentifier($pid).terminate" > "$RUNNER_TEMP/quit.txt" 2>&1 &
          for _ in $(seq 20); do
            gone && break
            sleep 1
          done
          echo "Asked to quit ($(cat "$RUNNER_TEMP/quit.txt")); gone after $(( $(date +%s) - started )) s"
          if ! gone; then
            echo "::error::The app didn't end within 20 s of a quit."
            kill "$pid"
            exit 1
          fi
          wait "$pid" || true
          # uvicorn's last line once its shutdown is done; the log store can lag behind.
          stopped=
          for _ in $(seq 15); do
            stopped=$(log show --last 5m --style compact --predicate 'process == "R3Con"' | grep -F 'Finished server process' || true)
            [ -n "$stopped" ] && break
            sleep 2
          done
          if [ -z "$stopped" ]; then
            echo "::error::The app ended on a quit without stopping its server."
            exit 1
          fi
          echo "$stopped"
      # An app that writes into its own bundle breaks its signature.
      - name: Check that running the app left its signature intact
        run: codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tee "$RUNNER_TEMP/codesign-after-a-run.txt"
      - name: The app's log
        if: failure()
        run: log show --last 10m --style compact --predicate 'process == "R3Con"' | tail -n 200
      - name: The app's identity, signature and sizes
        env:
          SIGNED_BY: ${{ steps.identity.outputs.name }}
          APP_SUBMISSION: ${{ steps.notarize-app.outputs.id }}
          APP_NOTARIZATION: ${{ steps.notarize-app.outputs.status }}
          SUBMISSION: ${{ steps.notarize.outputs.id }}
          NOTARIZATION: ${{ steps.notarize.outputs.status }}
        run: |
          plist="$APP/Contents/Info.plist"
          dmg=$(echo dist/*.dmg)
          compiled=$(find "$APP/Contents/Resources/app_packages/pydantic_core" -name "*.so" | head -n 1)
          {
            echo "| | |"
            echo "|---|---|"
            echo "| Bundle identifier | \`$(plutil -extract CFBundleIdentifier raw "$plist")\` |"
            echo "| Version | $(plutil -extract CFBundleShortVersionString raw "$plist") ($(plutil -extract CFBundleVersion raw "$plist")) |"
            echo "| Sparkle | $(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Frameworks/Sparkle.framework/Resources/Info.plist") |"
            echo "| Architectures (pydantic_core) | $(lipo -archs "$compiled") |"
            echo "| \`$(basename "$APP")\` | $(du -sh "$APP" | cut -f1) |"
            echo "| \`$(basename "$dmg")\` | $(du -h "$dmg" | cut -f1) |"
            if [ -n "$SIGNED_BY" ]; then
              echo "| Signed by | $SIGNED_BY |"
              echo "| Notarization of the app | \`$APP_SUBMISSION\`: $APP_NOTARIZATION |"
              echo "| Notarization of the .dmg | \`$SUBMISSION\`: $NOTARIZATION |"
            fi
            for check in codesign spctl-and-stapler codesign-after-a-run; do
              if [ -f "$RUNNER_TEMP/$check.txt" ]; then
                printf '\n%s:\n\n```\n' "$check"
                cat "$RUNNER_TEMP/$check.txt"
                echo '```'
              fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.sign && 'r3con-mac-app-signed' || 'r3con-mac-app' }}
          path: |
            dist/R3Con.dmg
            dist/appcast.xml
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: window-screenshot
          path: ${{ runner.temp }}/window.png
          if-no-files-found: ignore
