name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked pyright

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv run --locked pytest --cov=r3con --cov-report=term-missing:skip-covered

  lowest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-suffix: lowest
      - run: uv run --resolution lowest-direct pytest

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv build
      - run: uv sync --locked --no-install-project
      - run: uv pip install dist/*.whl
      - name: The suite, against the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" -c "import r3con, sys; sys.exit(0 if '/site-packages/' in r3con.__file__ else f'testing {r3con.__file__}, not the wheel')"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest "$GITHUB_WORKSPACE/tests"
