name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI and tag the release (only on main)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      live: false

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Check the version
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          version="$(uv version --short)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl -fsS -o /dev/null "https://pypi.org/pypi/r3context/$version/json"; then
            echo "::error::r3context $version is already on PyPI; bump the version first."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the project version $version"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $GITHUB_REF_NAME is not on main"
              exit 1
            fi
          fi
          if [ "$PUBLISH" = true ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::publishing needs main; this run is on $GITHUB_REF"
              exit 1
            fi
            if [ "$(git log -1 --format=%H -S"version = \"$version\"" -- pyproject.toml)" != "$GITHUB_SHA" ]; then
              echo "::error::main's head is not the commit that set $version; dispatch right after the release commit merges."
              exit 1
            fi
            if git show-ref --verify --quiet "refs/tags/v$version"; then
              echo "::error::tag v$version already exists; bump the version first."
              exit 1
            fi
          fi
          release=false
          if [ "$GITHUB_EVENT_NAME" = push ] || [ "$PUBLISH" = true ]; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Before PyPI, so that a failed notarization publishes nothing. A dry run builds it unsigned.
  mac-app:
    needs: build
    uses: ./.github/workflows/mac-app.yml
    with:
      sign: ${{ needs.build.outputs.release == 'true' }}
    # The signing secrets live in mac-app.yml's environment, but a caller must still pass them.
    secrets: inherit

  publish:
    if: needs.build.outputs.release == 'true'
    needs: [build, mac-app]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/r3context/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: r3con-mac-app-signed
          path: dist/
      # The release commit's body is the notes; its trailers are attribution, not notes.
      - name: Build the notes
        run: |
          git log -1 --format=%b "$GITHUB_SHA" |
            sed -E '/^(Co-Authored-By|Claude-Session): /Id' |
            git stripspace > notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "r3context $VERSION" --notes-file notes.md --verify-tag
          else
            gh release create "v$VERSION" dist/* --title "r3context $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          fi
