[project]
name = "r3context"
version = "0.6.10"
description = "Just-in-time reasoning over a collection of documents: surface relevance, structure it, reason over it."
readme = "README.md"
authors = [
    { name = "Michael Theologitis", email = "michael.theologitis@outlook.com" }
]
requires-python = ">=3.11"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES"]
keywords = ["llm", "agent", "documents", "reasoning", "multi-document", "question-answering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "litellm>=1.103,<2",
    "jinja2>=3.1.0",
    # 2.14.0 locks model_rebuild (pydantic#13419): threads' first calls raced before it.
    "pydantic>=2.14",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0",
    "pypdf>=6.19.0",
    # 1.12.2 fixes a denial of service a crafted document could cause.
    "mammoth>=1.12.2",
    # The first with table_infer_header.
    "markdownify>=1.0.0",
    # The first with Python 3.14 wheels that is not yanked.
    "rapidfuzz>=3.14.1",
]

[project.optional-dependencies]
# The app's page and its local server, `r3con app` (r3con.app).
app = [
    "platformdirs>=4.1",
    "starlette>=1.10",
    "uvicorn>=0.54",
]

# Local development only — NOT part of the published package (PEP 735 dependency groups
# never reach the wheel). uv installs the `dev` group by default, so a plain `uv sync`
# gives you an environment that can run examples/quickstart.ipynb as a notebook: pick
# .venv as the kernel and go. `pip` is here because editors shell out to it when they
# offer to fix a kernel themselves, and a uv-made venv has none. The rest are the
# checks and the test runner, the same ones CI runs, the app extra, for its tests, and
# Toga's core, for the Mac app's window (r3con.app.window), whose Mac backend only the
# Mac app bundles.
[dependency-groups]
dev = [
    "r3context[app]",
    "httpx2>=2.16",
    "ipykernel>=6.29",
    "pip>=24.0",
    "pyright>=1.1.414",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-httpserver>=1.1",
    "pytest-socket>=0.8",
    "ruff>=0.16",
    "toga-core>=0.5.7,<0.6",
]
# Toga's Mac backend, which the Mac app bundles and nothing installs here: it is in the
# group only so that uv.lock pins it, and its dependencies, for the app's build.
mac-app = ["toga-cocoa>=0.5.7,<0.6; sys_platform == 'darwin'"]
# [build-system]'s backend, locked so that the Mac app's build of this project uses
# uv.lock's version and files. If the two ranges part, that build fails in pip.
build-backend = ["uv_build>=0.9.17,<0.10.0"]

[project.scripts]
r3con = "r3con.cli:main"

[project.urls]
Homepage = "https://github.com/michaeltheologitis/r3con"
Repository = "https://github.com/michaeltheologitis/r3con"

# The DISTRIBUTION is `r3context` (the PyPI name); the IMPORT PACKAGE is `r3con`.
# uv_build derives the module name from the project name by default, so it has to be
# told explicitly — otherwise it looks for src/r3context/ and the build fails.
[tool.uv.build-backend]
module-name = "r3con"
module-root = "src"

# The Mac app, which .github/workflows/mac-app.yml builds: Briefcase bundles Python, this
# project with its app extra, and Toga, and starts the app as `python -m r3con`, which
# opens the window there. Its version, description, license and author are [project]'s.
# Its bundle identifier, `bundle` and the app's name joined
# (io.github.michaeltheologitis.r3con), must never change; formal_name, the name it
# shows in Finder, the Dock, its menu and its window's title, can.
[tool.briefcase]
bundle = "io.github.michaeltheologitis"

[tool.briefcase.app.r3con]
formal_name = "R3Con"
# Briefcase needs the app's package among its sources. The project is installed as a
# requirement too, for its app extra's packages and for its metadata, which
# r3con.__version__ reads. Briefcase installs with --only-binary, which a local
# directory is exempt from.
sources = ["src/r3con"]
requires = [".[app]"]
# Every package at uv.lock's version, the one CI tests, and the build backend at its
# locked version and hashes: mac-app.yml writes these constraints with `uv export`
# before it builds, and pip fails without them.
requirement_installer_args = [
    "--constraint",
    "./build/constraints.txt",
    "--build-constraint",
    "./build/build-constraints.txt",
]

[tool.briefcase.app.r3con.macOS]
# At the version the mac-app group locks.
requires = ["toga-cocoa"]
# Apple Silicon only. A universal build fails to merge charset_normalizer: its only
# arm64 wheel is universal2, and Briefcase reinstalls it, thinned, for x86_64.
universal_build = false
# The window loads its page from the app's own server, over http on 127.0.0.1.
info.NSAppTransportSecurity.NSAllowsLocalNetworking = true

[tool.ruff]
extend-exclude = ["src/r3con/runtime/python_executor.py"]

[tool.pyright]
# tests/app keeps the type checks it had as the app's own project.
include = ["src", "evals", "tests/app", "tests/fakes.py"]
exclude = ["src/r3con/runtime/python_executor.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so the tests can import the evals package, which is not installed.
pythonpath = ["."]
addopts = [
    "-m",
    "not live",
    "--disable-socket",
    "--allow-unix-socket",
    "--strict-markers",
]
markers = [
    "live: calls a real provider; runs only under `pytest -m live`",
    "experiment: a measured run against a real provider, dispatched once; also marked live",
]

[tool.coverage.run]
omit = ["*/r3con/runtime/python_executor.py"]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"
