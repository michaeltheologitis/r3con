# The default run config. Everything here shapes the OUTPUT — model, relevance rounds,
# the reasoning path, prompt versions, generation params — and together these are a run's
# identity (RunConfig.label()). Runtime knobs (parallelism, retry caps, where logs go)
# live in settings.py, not here.
#
# Override single fields at the call site or on the CLI. For a different experiment, add
# another configs/<name>.yaml (yours are picked up from ./configs) and select it by name.

# Any litellm model string: openai/…, anthropic/…, gemini/…, hosted_vllm/…, ollama/…
model: openai/gpt-6-luna

# How many times each document is read. 1 = each read against the question alone;
# 2+ = re-read in light of the other documents' relevance snippets.
relevance_rounds: 2

# How reasoning answers. direct = one call over the summaries and the whole parse;
# coding = an agent that reads the parse with code, and runs when direct does not fit.
reasoning: direct

prompts:
  relevance/first-round: v1
  relevance/later-rounds: v1
  structuring/schema: v1
  structuring/parsing: v1
  reasoning/direct: v1
  reasoning/coding: v1

# Passed straight to litellm.completion — temperature, top_p, seed, extra_body, anything
# it accepts. Empty means provider defaults.
params: {}
