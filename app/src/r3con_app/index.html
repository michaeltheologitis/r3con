<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>r3con Run Panel</title>
<style>
/* Layout: a terminal window. The run panel (a pannable canvas) fills the left, a 46ch column on the
   right holds the chat and the files tab; on phones the panel stacks above that column. */
:root {
  --bg: #fcfbfa;
  --panel: #f4f2ef;
  --fg: #1f1e1c;
  --dim: #736b62;
  --line: #e5e0d9;
  --code: #f0ece7;
  --accent: #c15f3c;
  --ok: #3f7d4e;
  --err: #b1452f;
  --warn: #8f6113;
  --fill-orange: #f27b45;
  --fill-yellow: #f5cd55;
  --fill-blue: #40bde8;
  --tree-ink: #1f1e1c;
  --shadow: 0 10px 30px rgba(31, 30, 28, 0.12), 0 1px 3px rgba(31, 30, 28, 0.06);
  --font: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --gutter: 16px;
  --icon-size: 28px;
  --doc-icon-size: 46px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1918;
    --panel: #141312;
    --fg: #e8e5e1;
    --dim: #968e84;
    --line: #2e2b28;
    --code: #232120;
    --accent: #d77757;
    --ok: #7fb38a;
    --err: #e2806d;
    --warn: #d6a54c;
    --fill-orange: #d96d3e;
    --fill-yellow: #d8b24c;
    --fill-blue: #3aa4cd;
    --tree-ink: #0e0d0c;
    --shadow: 0 12px 34px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1918;
  --panel: #141312;
  --fg: #e8e5e1;
  --dim: #968e84;
  --line: #2e2b28;
  --code: #232120;
  --accent: #d77757;
  --ok: #7fb38a;
  --err: #e2806d;
  --warn: #d6a54c;
  --fill-orange: #d96d3e;
  --fill-yellow: #d8b24c;
  --fill-blue: #3aa4cd;
  --tree-ink: #0e0d0c;
  --shadow: 0 12px 34px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font: 13.5px/1.55 var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
p { margin: 0; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.btn {
  font: inherit;
  color: var(--dim);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  border-radius: 3px;
  white-space: nowrap;
}
.btn:hover { color: var(--fg); }
.k, .dim { color: var(--dim); }
.ok { color: var(--ok); }
.err { color: var(--err); }
.flag { color: var(--warn); }
.vh {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.vh:focus-visible + label { outline: 1px solid var(--accent); outline-offset: 2px; }
.probe { position: absolute; visibility: hidden; white-space: pre; }

/* ---- frame ---- */
.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  padding-block: 0 var(--gutter);
}
.topbar {
  display: flex;
  align-items: baseline;
  gap: 2ch;
  min-width: 0;
  padding-block: 0.65em;
}
.brand { color: var(--accent); font-weight: 600; white-space: nowrap; }
.status {
  flex: 1;
  min-width: 0;
  color: var(--dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.top-actions { display: flex; gap: 2ch; margin-left: auto; }
.frame {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 46ch;
  min-height: 0;
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}
@media (max-width: 760px) {
  .frame {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 55fr) minmax(0, 45fr);
  }
  .side { border-left: 0 !important; border-top: 1px solid var(--line); }
  .topbar { flex-wrap: wrap; row-gap: 0.1em; }
  .status { order: 3; flex-basis: 100%; }
}

/* ---- panel ---- */
.panel {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: var(--panel);
  touch-action: none;
  cursor: grab;
}
.panel.panning { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; user-select: none; -webkit-user-select: none; }
.world.glide { transition: transform 0.35s ease; }
.edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.edge {
  fill: none;
  stroke: var(--dim);
  stroke-width: calc(1px / var(--k, 1));
  transition: opacity 0.4s, stroke 0.4s, stroke-width 0.4s;
}
.edge.context { opacity: calc(0.16 * var(--context-fade, 1)); }
.edge.self { opacity: 0.5; stroke-dasharray: calc(2px / var(--k, 1)) calc(3px / var(--k, 1)); }
.edge.flow { opacity: 0.5; }
.edge.cite { opacity: 0.85; }
.edge.hl { opacity: 0.9; stroke: var(--fg); }
.panel.is-lit .edge { opacity: 0.07; }
.panel.is-lit .edge.context { opacity: calc(0.07 * var(--context-fade, 1)); }
.panel.is-lit .edge.hl { opacity: 0.55; }
.panel.is-lit .edge.lit { opacity: 1; stroke: var(--accent); stroke-width: calc(1.6px / var(--k, 1)); }
.edge.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 0.7s ease-out forwards; }
.edge.fade { animation: fade 0.6s ease-out; }

.node {
  position: absolute;
  --node-icon: var(--icon-size);
  translate: -50% calc(var(--node-icon) / -2);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 0.5ch;
  color: var(--dim);
  white-space: nowrap;
  cursor: pointer;
  border-radius: 4px;
  transition: opacity 0.4s;
}
.node.enter { animation: node-in 0.35s ease-out; }
.node.doc { --node-icon: var(--doc-icon-size); }
.node .icon { width: var(--node-icon); height: var(--node-icon); color: var(--fg); transition: color 0.4s; }
.node .icon svg { display: block; width: var(--node-icon); height: var(--node-icon); overflow: visible; }
.node .label { line-height: 1.5; background: var(--panel); }
.node .spin { position: absolute; top: -0.7em; left: calc(50% + var(--node-icon) / 2 - 2px); color: var(--accent); display: none; }
.node.working .spin { display: block; }
.node.working .icon { color: var(--dim); }
.node.void { opacity: 0.45; }
.node.failed .icon, .node.failed .label { color: var(--err); }
.node.failed .icon { opacity: 0.6; }
.node:hover .label, .node.selected .label { color: var(--fg); }
.node.selected .name { font-weight: 600; }
.node.answer .icon {
  display: grid;
  place-items: center;
  color: var(--accent);
  font-size: 26px;
  line-height: 1;
}
.panel.is-lit .node { opacity: 0.3; }
.panel.is-lit .node.on-path { opacity: 1; }
.panel.is-lit .node.on-path .icon { color: var(--accent); }
.panel.is-lit .node.on-path .label { color: var(--fg); }
.fill-orange { fill: var(--fill-orange); }
.fill-yellow { fill: var(--fill-yellow); }
.fill-blue { fill: var(--fill-blue); }
.ink { stroke: var(--tree-ink); }
.panel.is-lit .node.parsed.on-path .icon { --tree-ink: var(--accent); }
.node.pending .icon { opacity: 0.5; }

.panel-hint {
  position: absolute;
  left: 1.5ch;
  top: 0.7em;
  color: var(--dim);
  pointer-events: none;
}
.panel-tools {
  position: absolute;
  left: 1.5ch;
  bottom: 0.7em;
  display: flex;
  gap: 2ch;
  color: var(--dim);
}

.inspector, .settings {
  overflow: auto;
  padding: 0.9em 2ch 1em;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: var(--shadow);
  overscroll-behavior: contain;
}
.inspector {
  position: absolute;
  z-index: 5;
  width: min(54ch, calc(100% - 20px));
  max-height: calc(100% - 20px);
  display: flex;
  flex-direction: column;
  gap: 0.75em;
  cursor: auto;
  touch-action: pan-x pan-y;
}
.settings {
  --settings-width: min(52ch, calc(100vw - 2 * var(--gutter)));
  inset: auto;
  margin: 0;
  width: var(--settings-width);
  color: var(--fg);
}
.settings-body { display: flex; flex-direction: column; gap: 0.9em; }
.keys {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) 3ch;
  align-items: baseline;
  gap: 0.45em 2ch;
}
.keys label { font-weight: 600; }
#key-other { grid-column: 2; }
.field {
  width: 100%;
  min-width: 0;
  padding: 0.3em 1ch;
  font: inherit;
  color: var(--fg);
  background: var(--code);
  border: 1px solid var(--line);
  border-radius: 4px;
}
.field:focus-visible { outline: 1px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.field-row { display: flex; align-items: baseline; gap: 2ch; }
.inspector.wide { width: min(84ch, calc(100% - 20px)); }
.inspector > .btn { align-self: flex-start; }
.insp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 2ch; }
.inspector .insp-head { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.inspector.moving .insp-head { cursor: grabbing; }
.insp-title { font-weight: 600; overflow-wrap: anywhere; }
.insp-title .g { color: var(--fg); }
.insp-title .g.accent { color: var(--accent); }
.insp-text { overflow-wrap: anywhere; }
.insp-text.strong { font-weight: 600; }
.row { overflow-wrap: anywhere; }
.ref {
  font: inherit;
  color: var(--fg);
  background: none;
  border: 0;
  padding: 0;
  text-align: left;
  cursor: pointer;
  text-decoration: underline;
  text-decoration-color: var(--line);
  text-underline-offset: 3px;
}
.ref:enabled:hover { text-decoration-color: var(--fg); }
.records { display: flex; flex-direction: column; gap: 0.15em; }
.rec { padding-left: 2ch; overflow-wrap: anywhere; }
.code {
  margin: 0;
  padding: 0.7em 1.5ch;
  overflow: auto;
  font: inherit;
  white-space: pre;
  tab-size: 4;
  background: var(--code);
  border-radius: 4px;
}
.code.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }

/* ---- side column ---- */
.side {
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  background: var(--bg);
  border-left: 1px solid var(--line);
}
.tabs {
  display: flex;
  gap: 3ch;
  padding: 0.6em 2ch;
  border-bottom: 1px solid var(--line);
}
.tab[aria-selected="true"] { color: var(--fg); font-weight: 600; }
.tab .count { color: var(--dim); font-weight: 400; }
.pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.transcript {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 0.6em 2ch 1em;
  display: flex;
  flex-direction: column;
}
.turn, .turn-body { display: flex; flex-direction: column; }
.line {
  display: grid;
  grid-template-columns: 2ch minmax(0, 1fr);
  align-items: start;
  width: 100%;
  padding: 0;
  font: inherit;
  color: inherit;
  text-align: left;
  background: none;
  border: 0;
  border-radius: 3px;
  overflow-wrap: anywhere;
}
.line.main, .line.answer, .line.spin { margin-top: 0.55em; }
.line.sub { padding-left: 2ch; color: var(--dim); }
.line.dim { color: var(--dim); }
.line.link { cursor: pointer; }
.line.link:enabled:hover { color: var(--fg); }
.line.link:disabled, .ref:disabled { cursor: default; text-decoration: none; }
.line.user {
  margin-top: 0.9em;
  padding: 0.3em 1ch;
  grid-template-columns: 2ch minmax(0, 1fr);
  background: var(--panel);
  border-radius: 4px;
}
.line.user .g { color: var(--dim); }
.line.answer .g { color: var(--accent); }
.line.answer .t { font-weight: 600; }
.line.spin { color: var(--dim); }
.line.spin .g { color: var(--accent); }

.ask {
  margin: 0 2ch;
  padding: 0.55em 1.5ch 0.45em;
  display: flex;
  flex-direction: column;
  gap: 0.3em;
  border: 1px solid var(--line);
  border-radius: 6px;
}
.ask:focus-within { border-color: var(--accent); }
.prompt { position: relative; }
.prompt .caret { position: absolute; left: 0; top: 0; color: var(--dim); }
.ask:focus-within .caret { color: var(--accent); }
.prompt:has(textarea:placeholder-shown) .caret { visibility: hidden; }
#question {
  display: block;
  width: 100%;
  min-height: calc(1.55em * 2);
  max-height: calc(1.55em * 6);
  field-sizing: content;
  padding: 0 0 0 2ch;
  font: inherit;
  color: var(--fg);
  background: none;
  border: 0;
  outline: none;
  resize: none;
}
#question:placeholder-shown { padding-left: 0; }
.field::placeholder, #question::placeholder { color: var(--dim); opacity: 1; }
.ask-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 2ch; color: var(--dim); }
.pick { position: relative; display: flex; min-width: 0; }
.pick::after { content: "▾"; position: absolute; right: 0; pointer-events: none; }
.pick:hover { color: var(--fg); }
#model-pick {
  appearance: none;
  field-sizing: content;
  min-width: 0;
  max-width: 100%;
  padding: 0 2ch 0 0;
  font: inherit;
  color: inherit;
  text-overflow: ellipsis;
  background: none;
  border: 0;
  cursor: pointer;
}
#model-pick optgroup, #model-pick option { color: var(--fg); background: var(--bg); }
#model-hint { align-self: flex-start; }
.ask-actions { display: flex; gap: 2ch; }
.run-btn { font-weight: 600; }
.note { padding: 0.5em 2ch 0.7em; color: var(--dim); }

.files {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 0.9em 2ch 1em;
  display: flex;
  flex-direction: column;
  gap: 0.9em;
}
.file-list { list-style: none; margin: 0; padding: 0; }
.file {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 2ch;
  width: 100%;
  padding: 0.05em 0;
  font: inherit;
  color: var(--fg);
  text-align: left;
  background: none;
  border: 0;
  border-radius: 3px;
  cursor: pointer;
}
.file .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file .size { color: var(--dim); }
.file:hover .name { text-decoration: underline; text-decoration-color: var(--dim); text-underline-offset: 3px; }
.file-actions { display: flex; flex-wrap: wrap; gap: 0.3em 3ch; }
.file-actions label { cursor: pointer; }
.drop-hint {
  padding: 0.9em 2ch;
  color: var(--dim);
  text-align: center;
  border: 1px dashed var(--line);
  border-radius: 6px;
}
.file-view { gap: 0.7em; }
.file-view .back { align-self: flex-start; }
.drop-overlay {
  position: absolute;
  inset: 0;
  z-index: 6;
  display: none;
  place-items: center;
  color: var(--accent);
  background: var(--bg);
  opacity: 0.94;
  border: 1px dashed var(--accent);
  pointer-events: none;
}
.side.dropping .drop-overlay { display: grid; }

@keyframes node-in { from { opacity: 0; scale: 0.8; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="brand">✻ r3con</span>
    <span class="status" id="run-status" aria-live="polite"></span>
    <nav class="top-actions" aria-label="Run controls">
      <button class="btn" id="replay-btn" type="button" hidden>replay</button>
      <button class="btn" id="settings-btn" type="button" popovertarget="settings">settings</button>
      <button class="btn" id="theme-btn" type="button">theme · light</button>
    </nav>
  </header>

  <div class="settings" id="settings" popover role="dialog" aria-label="Settings">
    <form id="settings-form" autocomplete="off"></form>
    <div class="settings-body">
      <div class="insp-head">
        <div class="insp-title"><span class="g">● </span>settings</div>
        <button class="btn" id="settings-close" type="button" popovertarget="settings" popovertargetaction="hide" aria-label="close settings">esc</button>
      </div>
      <div class="keys" id="keys"></div>
      <p class="k" id="other-hint">Other is a self-hosted or OpenAI-compatible server, such as vLLM: pick other model… under the question and type its model.</p>
      <p class="k" id="keys-note"></p>
      <div class="field-row">
        <button class="btn run-btn" id="settings-save" type="submit" form="settings-form">save</button>
        <button class="btn" id="keys-show" type="button">show keys</button>
        <span class="k" id="settings-saved" aria-live="polite"></span>
      </div>
    </div>
  </div>

  <div class="frame">
    <main class="panel" id="panel" aria-label="Run panel">
      <div class="world" id="world">
        <svg class="edges" aria-hidden="true">
          <g id="layer-base"></g>
          <g id="layer-mid"></g>
          <g id="layer-lit"></g>
        </svg>
        <div id="nodes"></div>
      </div>
      <div class="panel-hint" id="panel-hint" hidden></div>
      <div class="panel-tools">
        <button class="btn" id="arrange-btn" type="button">arrange</button>
        <button class="btn" id="fit-btn" type="button">fit</button>
        <span id="zoom-level">100%</span>
      </div>
      <div class="inspector" id="inspector" role="dialog" aria-label="Details" tabindex="-1" hidden></div>
    </main>

    <aside class="side" id="side">
      <div class="tabs" role="tablist" aria-label="Chat and files">
        <button class="btn tab" id="tab-chat" type="button" role="tab" aria-selected="true" aria-controls="chat-pane">chat</button>
        <button class="btn tab" id="tab-files" type="button" role="tab" aria-selected="false" aria-controls="files-pane">files <span class="count" id="files-count"></span></button>
      </div>

      <section class="pane" id="chat-pane" role="tabpanel" aria-labelledby="tab-chat">
        <div class="transcript" id="transcript" aria-live="polite"></div>
        <form class="ask" id="ask-form">
          <div class="prompt">
            <span class="caret" aria-hidden="true">›</span>
            <textarea id="question" name="question" rows="2" placeholder="› ask about your documents" aria-label="Ask about your documents"></textarea>
          </div>
          <div class="ask-foot">
            <span class="pick"><select id="model-pick" aria-label="model"></select></span>
            <span class="ask-actions">
              <button class="btn" id="new-run-btn" type="button" title="⌘/Ctrl+Enter" aria-keyshortcuts="Control+Enter Meta+Enter" hidden>new run</button>
              <button class="btn run-btn" id="run-btn" type="submit">run ⏎</button>
            </span>
          </div>
          <input class="field" id="model-other" type="text" spellcheck="false" autocapitalize="off" placeholder="any LiteLLM model, e.g. hosted_vllm/qwen3-32b" aria-label="other model" hidden disabled>
          <button class="btn" id="model-hint" type="button" popovertarget="settings">add a key in settings</button>
          <p class="k" id="ask-note" hidden></p>
        </form>
      </section>

      <section class="pane" id="files-pane" role="tabpanel" aria-labelledby="tab-files" hidden>
        <div class="files" id="file-list-view">
          <div class="dim" id="files-head"></div>
          <ul class="file-list" id="file-list"></ul>
          <div class="file-actions">
            <input class="vh" id="file-input" type="file" multiple>
            <label class="btn" for="file-input">+ add files</label>
            <input class="vh" id="folder-input" type="file" webkitdirectory multiple>
            <label class="btn" for="folder-input">+ add folder</label>
            <button class="btn" id="sample-btn" type="button" hidden>use the sample memos</button>
          </div>
          <div class="drop-hint">or drop files and folders here</div>
          <p class="err" id="files-error" hidden></p>
        </div>
        <div class="files file-view" id="file-view" hidden></div>
      </section>

      <p class="note" id="mode-note"></p>
      <div class="drop-overlay" aria-hidden="true">drop to add files</div>
    </aside>
  </div>
</div>

<script>
(() => {
  'use strict';

  const SAMPLE = {
 "question": "Which maintenance contractor's sites logged the most equipment incidents in Q3 in total, and how many? Give the contractor's name, not its code.",
 "model": "gpt-6-luna",
 "version": "0.4.0",
 "runFolder": "20261028T223555Z_43b61722",
 "created": "2026-10-28T22:35:55+00:00",
 "docs": [
  {
   "name": "01_northgate.txt",
   "text": "MEMO — Northgate site, Q3 operations review\n\nEquipment incidents logged this quarter: 5.\nThree were conveyor stoppages, two were HVAC trips.\nPlanned maintenance at this site is carried out under contractor code CT-118.\nSite manager: Dana Reyes.\n",
   "size": 247
  },

      // Storage can be blocked; the page works without it for this visit.
    }
  }

  function removeStored(key) {
    try {
      localStorage.removeItem(key);
    } catch {
      // Blocked storage holds nothing to remove.
    }
  }

  function excerpt(text, max) {
    const flat = text.replace(/\s+/g, ' ').trim();
    if (flat.length <= max) return flat;
    const cut = flat.slice(0, max);
    const space = cut.lastIndexOf(' ');
    return `${space > max * 0.6 ? cut.slice(0, space) : cut}…`;
  }

  function splitId(id) {
    const [kind, doc] = id.split('-');
    return [kind, doc === undefined ? null : Number(doc)];
  }

  function docLabel(run, i) {
    return stripExt(run.docs[i].name);
  }

  function nodeName(id) {
    const [kind, d] = splitId(id);
    if (kind === 'doc') return state.nodes.get(id)?.file.name ?? 'document';
    if (kind === 'schema') return 'structure';
    if (kind === 'answer') return answerLabel(answerOf(state.run, id));
    const label = docLabel(state.run, d);
    return `${label} · ${KIND_SUFFIX[kind]}`;
  }

  function schemaClasses(code) {
    return [...code.matchAll(/class (\w+)\(BaseModel\)/g)].map((m) => m[1]).filter((c) => c !== 'Parse');
  }

  function spent(totals) {
    const { tokens = null, usd = null } = totals ?? {};
    return [tokens !== null && `${fmtInt(tokens)} tokens`, usd !== null && fmtUsd(usd)].filter(Boolean);
  }

  // A recorded or simulated parse holds its records; a live one, only how many there were.
  const recordCount = (parse) => parse.records?.length ?? parse.n_records;

  // ---------- r3con-app ----------

  // An error whose message is for the user: r3con-app's own words, or what went wrong reaching it.
  class ServerError extends Error {}

  // A stale token or r3con-app out of reach, kept for the status until a call to it succeeds.
  let connectionProblem = null;

  // What to tell the user about `error`; one that is not the server's is a bug, so it also goes to the console.
  function explain(error, fallback, consoleText = fallback) {
    if (error instanceof ServerError) return error.message;
    console.error(consoleText, error);
    return fallback;
  }

  const lostConnection = () => new ServerError(LOST_CONNECTION);

  async function api(path, { method = 'GET', body } = {}) {
    let response;
    try {
      response = await fetch(path, {
        method,
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: body === undefined ? undefined : JSON.stringify(body),
      });
    } catch {
      connectionProblem = LOST_CONNECTION;
      throw lostConnection();
    }
    if (response.status === UNAUTHORIZED) {
      connectionProblem = STALE_TOKEN;
      throw new ServerError(STALE_TOKEN);
    }
    if (response.ok) {
      connectionProblem = null;
      return response;
    }
    const reply = await response.json().catch(() => null);
    throw new ServerError(reply?.error ?? `r3con-app answered ${response.status} ${response.statusText}`.trim());
  }

  function frameData(frame) {
    const fields = frame.split(/\r?\n/).filter((field) => field.startsWith('data:'));
    return fields.map((field) => field.slice('data:'.length).replace(/^ /, '')).join('\n');
  }

  // Server-sent events, read with fetch since EventSource can't send the token. A frame ends at a
  // blank line, and a chunk can end anywhere in one.
  async function* serverEvents(body) {
    const reader = body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = '';
    try {
      for (;;) {
        const { value, done } = await reader.read().catch(() => {
          throw lostConnection();
        });
        if (done) return;
        const frames = (buffer + value).split(/\r?\n\r?\n/);
        buffer = frames.pop();
        for (const data of frames.map(frameData).filter(Boolean)) yield JSON.parse(data);
      }
    } finally {
      // Closes the response when drawing an event throws; a stream that already failed rejects with
      // the error the read threw.
      reader.cancel().catch(() => {});
    }
  }

  // Hands each of a run's or an ask's events to `onEvent`; a stream that stops before its last event lost the server.
  async function follow(path, onEvent) {
    const response = await api(path);
    let last = null;
    for await (const event of serverEvents(response.body)) {
      last = event;
      onEvent(event);
    }
    if (!ENDINGS.has(last?.type)) throw lostConnection();
  }

  const streaming = (kind) => [...state.streams].some((stream) => stream.kind === kind);

  function openStream(kind) {
    const stream = { kind };
    state.streams.add(stream);
    return stream;
  }

  function closeStream(stream) {
    state.streams.delete(stream);
    updateComposer();
  }

  // A live run's provenance names snippets by id, `<id>.<k>` for part k of a document read in parts.
  function docIndices(run, ids) {
    return [...new Set(ids.map((id) => run.ids.indexOf(id.split('.')[0])))];
  }

  function provenanceOf(run, { summary_ids, parse_ids }) {
    return { summary_ids: docIndices(run, summary_ids), parse_ids: docIndices(run, parse_ids) };
  }

  const totalsOf = (event) => ({ tokens: event.tokens?.total, usd: event.usd });
  const keyedProviders = (status) => Object.keys(PROVIDERS).filter((provider) => status[provider]);

  // ---------- spinner ----------

  let spinFrame = 0;
  setInterval(() => {
    if (reduceMotion()) return;
    spinFrame = (spinFrame + 1) % SPIN_FRAMES.length;
    for (const el of document.querySelectorAll('.node.working .spin, .node.working .glyph, .line.spin .g')) el.textContent = SPIN_FRAMES[spinFrame];
  }, SPIN_FRAME_MS);

  // ---------- runs ----------

  function sampleRun() {
    const finishOrder = (prefix) =>
      range(SAMPLE.docs.length).sort((a, b) => SAMPLE.calls[`${prefix}-${a}`].step - SAMPLE.calls[`${prefix}-${b}`].step);
    return {
      simulated: false,
      question: SAMPLE.question,
      docs: state.files,
      r1: SAMPLE.r1,
      r2: SAMPLE.r2,
      schema: SAMPLE.schema,
      parsed: SAMPLE.parsed,
      answer: SAMPLE.answer,
      calls: SAMPLE.calls,
      totals: SAMPLE.totals,
      model: SAMPLE.model,
      source: 'recorded run',
      order: { r1: finishOrder('r1'), r2: finishOrder('r2'), parsed: finishOrder('parsed') },
    };
  }

  function madeUpCitations(i, n) {
    if (n < 2) return [];
    const cites = [(i + 1) % n];
    if (i % 3 === 0 && n > 2) cites.push((i + 2) % n);
    return cites;
  }

  // A simulated answer to `question` over `run`: it cites every stride-th document it could, counted from
  // `shift`, and, as in r3con, only non-empty round-2 summaries and parses with records.
  function madeUpAnswer(run, question, shift) {
    const every = (stride, citable) => range(run.docs.length).filter((i) => citable(i) && (i + shift) % stride === 0).slice(0, MAX_SIMULATED_CITES);
    return {
      text: `r3con's answer to “${question}” would appear here. The documents it cites below are made up.`,
      provenance: {
        summary_ids: every(SIMULATED_SUMMARY_STRIDE, (i) => Boolean(run.r2[i].summary)),
        parse_ids: every(SIMULATED_PARSE_STRIDE, (i) => recordCount(run.parsed[i]) > 0),
      },
    };
  }

  function simulatedRun(files, question, model) {
    const n = files.length;
    const order = range(n);
    const summary = (f) => excerpt(f.text, SUMMARY_CHARS);
    const records = files.map((f) => (f.text.trim() ? [{ field: 'excerpts', record: { source: f.name, excerpt: excerpt(f.text, EXCERPT_CHARS) } }] : []));
    // As in r3con: only a non-empty summary or a parse with records cites, and only non-empty summaries.
    const hasSummary = (j) => Boolean(summary(files[j]));
    const madeUp = (i, hasOutput) => (hasOutput ? madeUpCitations(i, n).filter(hasSummary) : []);
    const run = {
      simulated: true,
      question,
      docs: files,
      r1: files.map((f) => ({ summary: summary(f), provenance: [] })),
      r2: files.map((f, i) => ({ summary: summary(f), provenance: madeUp(i, hasSummary(i)) })),
      schema: { code: SIMULATED_SCHEMA, thought: `${SIMULATED_LABEL}. A real run proposes a schema for your question here.` },
      parsed: records.map((docRecords, i) => ({ records: docRecords, provenance: madeUp(i, docRecords.length > 0) })),
      calls: null,
      totals: null,
      model,
      order: { r1: order, r2: order, parsed: order },
    };
    return { ...run, answer: madeUpAnswer(run, question, 0) };
  }

  // Filled in by r3con-app's events as they arrive; events carry no per-call tokens or cost, so it has no calls.
  function liveRun(question, model) {
    const empty = { r1: [], r2: [], schema: null, parsed: [], answer: null, calls: null, totals: null };
    return { simulated: false, id: null, ids: [], question, model, docs: state.files, ...empty };
  }

  function runSummary(run) {
    if (run.simulated) return `simulated run · ${run.model} · nothing was sent`;
    return [run.source, run.model, ...spent(run.totals)].filter(Boolean).join(' · ');
  }

  // An ask is `{ question, model, source, text, provenance, totals }`, its source recorded, simulated or live.
  function askSummary({ source, model, totals }) {
    const spend = source === 'simulated' ? ['nothing was sent'] : spent(totals);
    return [`${source} ask over this run`, model, ...spend].join(' · ');
  }

  // The run's own answer node is `answer`; ask k's, in run.answers, is `answer-k`.
  const askId = (k) => `answer-${k}`;

  // The run's own answer or an ask's, in one shape.
  function answerOf(run, id) {
    const [, k] = splitId(id);
    if (k === null) return { ...run.answer, question: run.question, model: run.model, simulated: run.simulated, summary: runSummary(run) };
    const ask = run.answers[k];
    return { ...ask, simulated: ask.source === 'simulated', summary: askSummary(ask) };
  }

  const answerLabel = ({ question, model }) => `${excerpt(question, LABEL_MAX)} · ${bareModel(model)}`;

  function cites(run, id) {
    const [kind, i] = splitId(id);
    if (kind === 'answer') {
      const { summary_ids, parse_ids } = answerOf(run, id).provenance;
      return [...summary_ids.map((d) => `r2-${d}`), ...parse_ids.map((d) => `parsed-${d}`)];
    }
    if (kind === 'parsed') return run.parsed[i].provenance.map((d) => `r2-${d}`);
    if (kind === 'r2') return run.r2[i].provenance.map((d) => `r1-${d}`);
    return [];
  }

  function ownDocument(run, id) {
    const [kind, i] = splitId(id);
    return PER_DOCUMENT.has(kind) ? docId(run.docs[i]) : null;
  }

  function answerLineage(run, answerId) {
    const nodes = new Set([answerId]);
    const edges = new Set();
    for (const id of nodes) {
      for (const from of [ownDocument(run, id), ...cites(run, id)].filter(Boolean)) {
        nodes.add(from);
        edges.add(`${from}>${id}`);
      }
    }
    return { nodes, edges };
  }

  // ---------- panel: view ----------

  function applyView() {
    world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
    world.style.setProperty('--k', view.k);
    $('zoom-level').textContent = `${Math.round(view.k * 100)}%`;
    positionInspector();
  }

  function glide() {
    if (reduceMotion()) return;
    world.classList.add('glide');
    setTimeout(() => world.classList.remove('glide'), GLIDE_MS);
  }

  function zoomAt(px, py, k) {
    const next = clamp(k, ZOOM.min, ZOOM.max);
    const wx = (px - view.x) / view.k;
    const wy = (py - view.y) / view.k;
    view.k = next;
    view.x = px - wx * next;
    view.y = py - wy * next;
    applyView();
  }

  function measureCharWidth() {
    const probe = h('span', { class: 'probe' }, '0'.repeat(20));
    document.body.append(probe);
    const width = probe.getBoundingClientRect().width / 20;
    probe.remove();
    return width || 8;
  }

  const charPx = measureCharWidth();

  function gridLayout(files, origin) {
    const layout = new Map();
    const origins = files.map((f, i) => origin(i, f));
    if (!origins.length) return layout;
    files.forEach((f, i) => {
      layout.set(docId(f), origins[i]);
      for (const kind of PER_DOCUMENT) layout.set(`${kind}-${i}`, { x: origins[i].x + COLUMN[kind] * GRID.colGap, y: origins[i].y });
    });
    const ys = origins.map((o) => o.y);
    layout.set('schema', { x: origins[0].x + COLUMN.schema * GRID.colGap, y: origins[0].y });
    layout.set('answer', { x: Math.max(...origins.map((o) => o.x)) + COLUMN.answer * GRID.colGap, y: (Math.min(...ys) + Math.max(...ys)) / 2 });
    return layout;
  }

  const tidyOrigin = (i) => ({ x: COLUMN.doc * GRID.colGap, y: i * GRID.rowGap });

  function nodeOrigin(i, file) {
    const node = state.nodes.get(docId(file));
    return { x: node.x, y: node.y };
  }

  // Asks stack around the run's own answer, one row gap apart: below it, above it, then further out.
  function askSpot(answer, k) {
    const out = Math.floor(k / 2) + 1;
    return { x: answer.x, y: answer.y + (k % 2 ? -out : out) * GRID.rowGap };
  }

  function plan(origin) {
    const files = state.run?.docs ?? state.files;
    const layout = gridLayout(files, origin);
    if (!state.run) return layout;
    state.files.filter(isPending).forEach((f, j) => layout.set(docId(f), origin(files.length + j, f)));
    state.run.answers.forEach((_, k) => layout.set(askId(k), askSpot(layout.get('answer'), k)));
    return layout;
  }

  function contentBounds() {
    const widest = Math.max('structure'.length, ...panelFiles().map((f) => fileLabel(f).length));
    // Once there is a run, an answer's label is its question and model, often wider than any file's.
    const width = (id) => (state.run && splitId(id)[0] === 'answer' ? nodeName(id).length : widest) * charPx + NODE_PAD_PX;
    const b = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
    for (const [id, p] of state.layout) {
      b.minX = Math.min(b.minX, p.x - width(id) / 2);
      b.maxX = Math.max(b.maxX, p.x + width(id) / 2);
      b.minY = Math.min(b.minY, p.y - BRIDGE_CLEARANCE);
      b.maxY = Math.max(b.maxY, p.y + iconHalf(splitId(id)[0]) + 2 * LABEL_LINE_PX);
    }
    for (const n of state.nodes.values()) {
      const halfW = n.el.offsetWidth / 2;
      b.minX = Math.min(b.minX, n.x - halfW);
      b.maxX = Math.max(b.maxX, n.x + halfW);
      b.minY = Math.min(b.minY, n.y - iconHalf(n.kind));
      b.maxY = Math.max(b.maxY, n.y - iconHalf(n.kind) + n.el.offsetHeight);
    }
    return Number.isFinite(b.minX) ? b : { minX: 0, maxX: 1, minY: 0, maxY: 1 };
  }

  function fit(animate = false) {
    const pw = panel.clientWidth;
    const ph = panel.clientHeight;
    if (!pw || !ph) return;
    const b = contentBounds();
    const bw = Math.max(1, b.maxX - b.minX);
    const bh = Math.max(1, b.maxY - b.minY);
    const k = clamp(Math.min((pw - 2 * FIT_MARGIN) / bw, (ph - 2 * FIT_MARGIN) / bh), ZOOM.min, ZOOM.fitMax);
    view.k = k;
    view.x = (pw - bw * k) / 2 - b.minX * k;
    view.y = (ph - bh * k) / 2 - b.minY * k;
    if (animate) glide();
    applyView();
  }

  function refit() {
    state.userMoved = false;
    fit(true);
  }

  // ---------- panel: nodes and edges ----------

  function iconFor(kind, settled) {
    if (kind === 'doc') return ICONS.document;
    if (kind === 'r1' || kind === 'r2') return ICONS.snippet;
    if (kind === 'answer') return '<span class="glyph" aria-hidden="true">✻</span>';
    return ICONS.tree(kind === 'parsed' && settled);
  }

  function nodeLabels(id, kind, file) {
    if (kind === 'schema' || kind === 'answer') return [nodeName(id)];
    if (kind === 'doc') return [fileLabel(file), isPending(file) ? 'not run' : null];
    return kind === 'parsed' ? [fileLabel(file)] : [fileLabel(file), KIND_SUFFIX[kind]];
  }

  function ariaName(node) {
    const stopped = node.el.classList.contains('failed') ? ', stopped' : '';
    if (node.kind === 'answer') {
      const { question, model } = answerOf(state.run, node.id);
      return `answer to ${question} · ${model}${stopped}`;
    }
    if (!node.file) return `${nodeName(node.id)}, ${ARIA_KIND[node.kind]}${stopped}`;
    if (node.kind !== 'doc') return `${stripExt(node.file.name)}, ${ARIA_KIND[node.kind]}${stopped}`;
    return `${node.file.name}, ${isPending(node.file) ? 'document, not run yet' : ARIA_KIND.doc}`;
  }

  function createNode(id, kind, pos, { working = false, file = null, enter = true } = {}) {
    const pending = kind === 'doc' && isPending(file);
    const classes = ['node', kind, working && 'working', pending && 'pending', enter && !reduceMotion() && 'enter'].filter(Boolean).join(' ');
    const el = h(
      'div',
      { class: classes, tabindex: '0', role: 'button', 'data-id': id, 'aria-pressed': kind === 'answer' ? 'false' : null },
      h('span', { class: 'icon', html: iconFor(kind, false) }),
      kind === 'answer' ? null : h('span', { class: 'spin', 'aria-hidden': 'true' }, '✻'),
      nodeLabels(id, kind, file).filter(Boolean).map((text, i) => h('span', { class: i ? 'label' : 'label name' }, text)),
    );
    const node = { id, kind, file, x: pos.x, y: pos.y, el };
    state.nodes.set(id, node);
    el.setAttribute('aria-label', ariaName(node));
    placeNode(node);
    nodesLayer.append(el);
    return node;
  }

  function addNode(id) {
    const [kind, d] = splitId(id);
    return createNode(id, kind, state.layout.get(id), { working: true, file: PER_DOCUMENT.has(kind) ? state.run.docs[d] : null });
  }

  function addDocNode(file, pos) {
    let last = null;
    for (const n of state.nodes.values()) if (n.kind === 'doc' && (!last || n.y > last.y)) last = n;
    // A node redrawn at its old position (a run starting) is not new, so it doesn't animate in.
    return createNode(docId(file), 'doc', pos ?? (last ? { x: last.x, y: last.y + GRID.rowGap } : tidyOrigin(0)), { file, enter: !pos });
  }

  function removeNode(id) {
    if (state.selected === id) closeInspector();
    if (state.hovered === id) state.hovered = null;
    state.nodes.get(id)?.el.remove();
    state.nodes.delete(id);
  }

  const easeOut = (t) => 1 - (1 - t) ** 3;

  let arrangeFrame = 0;

  function clearPanel() {
    cancelAnimationFrame(arrangeFrame);
    closeInspector();
    for (const layer of Object.values(layers)) layer.replaceChildren();
    state.edges.clear();
    nodesLayer.replaceChildren();
    state.nodes.clear();
    state.hovered = null;
    panel.classList.remove('is-lit');
  }

  // Document nodes are created only here: one per loaded or run file, at its position in `at` if
  // it had one, else below the last document node. A run's grid is planned once, when it starts;
  // later syncs only add or drop document entries.
  function syncDocNodes({ at = new Map(), animate = false, replan = !state.run } = {}) {
    const files = panelFiles();
    const keep = new Set(files.map(docId));
    for (const n of [...state.nodes.values()]) {
      if (n.kind !== 'doc' || keep.has(n.id)) continue;
      removeNode(n.id);
      state.layout.delete(n.id);
    }
    for (const f of files) {
      if (state.nodes.has(docId(f))) continue;
      const node = addDocNode(f, at.get(docId(f)));
      state.layout.set(node.id, { x: node.x, y: node.y });
    }
    if (replan) state.layout = plan(nodeOrigin);
    updateHint();
    if (!state.userMoved) fit(animate);
  }

  function placeNode(node) {
    node.el.style.left = `${node.x}px`;
    node.el.style.top = `${node.y}px`;
  }

  function drawnAt(node) {
    return { x: parseFloat(node.el.style.left), y: parseFloat(node.el.style.top) };
  }

  // The model takes the final positions at once; only the drawing slides there.
  function arrange() {
    cancelAnimationFrame(arrangeFrame);
    state.layout = plan(tidyOrigin);
    state.userMoved = false;
    const moves = [];
    for (const node of state.nodes.values()) {
      const to = state.layout.get(node.id);
      if (!to) continue;
      const from = drawnAt(node);
      Object.assign(node, to);
      if (from.x !== to.x || from.y !== to.y) moves.push({ node, from });
    }
    const finish = () => {
      for (const { node } of moves) placeNode(node);
      redrawEdges();
      positionInspector();
      if (!state.userMoved) refit();
    };
    if (!moves.length || reduceMotion()) return finish();
    const start = performance.now();
    const grabbed = new Set();
    const step = (now) => {
      const t = Math.min(1, (now - start) / ARRANGE_MS);
      if (t === 1) return finish();
      const drawn = new Map();
      for (const { node, from } of moves) {
        if (gesture.moved && node === gesture.node) grabbed.add(node);
        if (grabbed.has(node)) continue;
        const at = { x: from.x + (node.x - from.x) * easeOut(t), y: from.y + (node.y - from.y) * easeOut(t) };
        drawn.set(node, at);
        node.el.style.left = `${at.x}px`;
        node.el.style.top = `${at.y}px`;
      }
      redrawEdges((n) => drawn.get(n) ?? n);
      arrangeFrame = requestAnimationFrame(step);
    };
    arrangeFrame = requestAnimationFrame(step);
  }

  function markWorking(id) {
    state.nodes.get(id).el.classList.add('working');
  }

  // A node is settled when its call finished, empty or not, or failed when the run stopped first.
  function settleNode(id, { empty = false, failed = false } = {}) {
    const node = state.nodes.get(id);
    node.el.classList.remove('working');
    node.el.classList.toggle('void', empty);
    node.el.classList.toggle('failed', failed);
    node.el.querySelectorAll('.spin, .glyph').forEach((g) => {
      g.textContent = '✻';
    });
    if (node.kind === 'parsed' && !empty && !failed) node.el.querySelector('.icon').innerHTML = iconFor('parsed', true);
    node.el.setAttribute('aria-label', ariaName(node));
    if (state.selected === id) renderInspector();
  }

  // A node has landed once its call finished without the run or ask stopping first.
  function landed(id) {
    const classes = state.nodes.get(id)?.el.classList;
    return Boolean(classes) && !classes.contains('working') && !classes.contains('failed');
  }

  function blockers(a, b, at) {
    const pa = at(a);
    const pb = at(b);
    const lo = Math.min(pa.x + iconHalf(a.kind), pb.x + iconHalf(b.kind));
    const hi = Math.max(pa.x - iconHalf(a.kind), pb.x - iconHalf(b.kind));
    let count = 0;
    for (const n of state.nodes.values()) {
      if (n === a || n === b) continue;
      const p = at(n);
      if (p.x > lo && p.x < hi && Math.abs(p.y - (pa.y + pb.y) / 2) < iconHalf(n.kind) * 2) count += 1;
    }
    return count;
  }

  // One lane higher per blocker, so bridges from one node nest.
  function edgePath(a, b, at = (n) => n) {
    const pa = at(a);
    const pb = at(b);
    const sx = pa.x + iconHalf(a.kind) + EDGE_GAP;
    const tx = pb.x - iconHalf(b.kind) - EDGE_GAP;
    const hops = Math.abs(pa.y - pb.y) < ICON_HALF && tx > sx ? blockers(a, b, at) : 0;
    if (!hops) {
      const c = Math.max(MIN_CURVE, Math.abs(tx - sx) / 2);
      return `M${sx} ${pa.y} C${sx + c} ${pa.y} ${tx - c} ${pb.y} ${tx} ${pb.y}`;
    }
    const top = Math.min(pa.y, pb.y) - ICON_HALF - LANE_GAP * hops;
    const ramp = Math.min(BRIDGE_RAMP / hops, (tx - sx) / 4);
    return `M${sx} ${pa.y} Q${sx + ramp} ${top} ${sx + 2 * ramp} ${top} H${tx - 2 * ramp} Q${tx - ramp} ${top} ${tx} ${pb.y}`;
  }

  function layerFor(kind) {
    return kind === 'context' || kind === 'self' ? layers.base : layers.mid;
  }

  function animateEdge(el, how) {
    if (reduceMotion()) return;
    el.classList.remove('draw', 'fade');
    el.removeAttribute('pathLength');
    if (how === 'draw') el.setAttribute('pathLength', '1');
    el.classList.add(how);
    el.addEventListener(
      'animationend',
      () => {
        el.classList.remove(how);
        el.removeAttribute('pathLength');
      },
      { once: true },
    );
  }

  function addEdge(from, to, kind, how) {
    const key = `${from}>${to}`;
    let edge = state.edges.get(key);
    if (!edge) {
      edge = { key, from, to, kind, el: document.createElementNS(SVG_NS, 'path') };
      edge.el.classList.add('edge');
      edge.el.dataset.key = key;
      state.edges.set(key, edge);
    }
    edge.el.classList.remove(edge.kind);
    edge.kind = kind;
    edge.el.classList.add(kind);
    layerFor(kind).append(edge.el);
    edge.el.setAttribute('d', edgePath(state.nodes.get(from), state.nodes.get(to)));
    if (how) animateEdge(edge.el, how);
    const id = state.hovered ?? state.selected;
    edge.el.classList.toggle('hl', id !== null && (id === from || id === to));
    return edge;
  }

  function dropEdge(edge) {
    edge.el.remove();
    state.edges.delete(edge.key);
  }

  function redrawEdges(at) {
    for (const e of state.edges.values()) e.el.setAttribute('d', edgePath(state.nodes.get(e.from), state.nodes.get(e.to), at));
  }

  function refreshHighlight() {
    const id = state.hovered ?? state.selected;
    for (const e of state.edges.values()) e.el.classList.toggle('hl', id !== null && (e.from === id || e.to === id));
    for (const n of state.nodes.values()) n.el.classList.toggle('selected', n.id === state.selected);
  }

  // Lights the lineage of the run's lit answer, and nothing else; an answer that cites nothing lights nothing.
  function lightPath(run) {
    const path = run.lit && cites(run, run.lit).length ? answerLineage(run, run.lit) : null;
    panel.classList.toggle('is-lit', Boolean(path));
    for (const [id, n] of state.nodes) {
      n.el.classList.toggle('on-path', Boolean(path?.nodes.has(id)));
      if (n.kind === 'answer') n.el.setAttribute('aria-pressed', String(id === run.lit));
    }
    for (const e of state.edges.values()) {
      const on = Boolean(path?.edges.has(e.key));
      const layer = on ? layers.lit : layerFor(e.kind);
      e.el.classList.toggle('lit', on);
      if (e.el.parentNode !== layer) layer.append(e.el);
    }
  }

  // Exactly one answer is lit: the newest, or the one last selected. Only it draws faint lines from what it
  // was shown; every answer keeps its lines from what it cites.
  function lightAnswer(run, id) {
    for (const e of [...state.edges.values()]) {
      if (e.kind === 'context' && e.to !== id && splitId(e.to)[0] === 'answer') dropEdge(e);
    }
    for (const from of inputsOf(run, id)) {
      if (!state.edges.has(`${from}>${id}`)) addEdge(from, id, 'context', 'fade');
    }
    run.lit = id;
    lightPath(run);
  }

  // A landing ask is the newest answer, so it is lit, unless another answer's details are open.
  function lightLanded(run, id) {
    const open = state.selected;
    if (open && open !== id && splitId(open)[0] === 'answer') return;
    lightAnswer(run, id);
  }

  // A run lights its own answer, or again the one lit before a replay.
  const lightRun = (run) => lightAnswer(run, run.lit ?? 'answer');

  // ---------- inspector ----------

  function refs(ids) {
    if (!ids.length) return [h('span', { class: 'k' }, 'none')];
    return ids.map((id, i) => [
      i ? h('span', { class: 'k' }, ' · ') : null,
      state.nodes.has(id)
        ? h('button', { class: 'ref', type: 'button', onclick: () => jumpTo(id) }, nodeName(id))
        : h('span', { class: 'k' }, nodeName(id)),
    ]);
  }

  function row(key, ...value) {
    return h('div', { class: 'row' }, h('span', { class: 'k' }, key), ' ', value);
  }

  function textBlock(text, empty = 'nothing relevant') {
    return text ? h('p', { class: 'insp-text' }, text) : h('p', { class: 'insp-text k' }, empty);
  }

  function callMeta(run, id) {
    const call = run.calls?.[id];
    return call ? h('div', { class: 'k' }, `${fmtInt(call.tokens)} tokens · ${fmtUsd(call.usd)}`) : null;
  }

  function recordBlock(records) {
    const block = h('div', { class: 'records' });
    let field = null;
    for (const { field: f, record } of records) {
      if (f !== field) block.append(h('div', { class: 'k' }, f));
      field = f;
      const pairs = Object.entries(record).map(([k, v], i) => [
        i ? '  ' : '',
        h('span', { class: 'k' }, k),
        ' ',
        v === null ? h('span', { class: 'k' }, 'null') : String(v),
      ]);
      block.append(h('div', { class: 'rec' }, pairs));
    }
    return block;
  }

  function fileMeta(file) {
    const meta = [fmtBytes(file.size), file.sample ? 'sample memo' : 'your file'];
    if (isPending(file)) meta.push('not run yet');
    if (file.size > READ_BYTES) meta.push(`first ${fmtBytes(READ_BYTES)} shown`);
    return meta.join(' · ');
  }

  function fileText(file) {
    return file.text ? h('pre', { class: 'code wrap' }, file.text.slice(0, READ_BYTES)) : h('p', { class: 'k' }, 'This file has no readable text.');
  }

  function openFileButton(file, label) {
    return h('button', { class: 'btn', type: 'button', onclick: () => openFile(file) }, label);
  }

  function docBody(node) {
    const index = state.run ? state.run.docs.indexOf(node.file) : -1;
    return [
      h('div', { class: 'k' }, fileMeta(node.file)),
      fileText(node.file),
      index >= 0 && state.nodes.has(`r1-${index}`) ? row('summary', refs([`r1-${index}`])) : null,
      openFileButton(node.file, 'open in files ›'),
    ];
  }

  function snippetBody(run, kind, d) {
    const id = `${kind}-${d}`;
    return [
      textBlock(run[kind][d].summary),
      row('read', refs([docId(run.docs[d])])),
      kind === 'r2' ? row('drew on', refs(cites(run, id))) : null,
      callMeta(run, id),
      openFileButton(run.docs[d], 'open document ›'),
    ];
  }

  function inspectorBody(id) {
    const run = state.run;
    const [kind, d] = splitId(id);
    const node = state.nodes.get(id);
    if (kind === 'doc') return docBody(node);
    if (node.el.classList.contains('working')) return [h('p', { class: 'k' }, 'working…')];
    if (node.el.classList.contains('failed')) return [h('p', { class: 'k' }, kind === 'answer' && d !== null ? 'the ask stopped before it answered' : 'the run stopped before this finished')];
    if (kind === 'r1' || kind === 'r2') return snippetBody(run, kind, d);
    if (kind === 'schema') {
      return [
        run.schema.thought ? row('why', run.schema.thought) : null,
        h('pre', { class: 'code' }, run.schema.code),
        row('fills', plural(run.docs.length, 'parsed document')),
        callMeta(run, 'schema'),
      ];
    }
    if (kind === 'parsed') {
      const parse = run.parsed[d];
      const count = recordCount(parse);
      return [
        parse.records?.length ? recordBlock(parse.records) : textBlock(count ? plural(count, 'record') : '', 'no records'),
        row('read', refs([docId(run.docs[d])])),
        row('drew on', refs(cites(run, id))),
        row('filled from', refs(['schema'])),
        callMeta(run, id),
        openFileButton(run.docs[d], 'open document ›'),
      ];
    }
    const answer = answerOf(run, id);
    return [
      answer.simulated ? h('div', { class: 'flag' }, SIMULATED_LABEL) : null,
      h('p', { class: 'insp-text strong' }, answer.text),
      row('asked', answer.question),
      row('drew on summaries', refs(answer.provenance.summary_ids.map((i) => `r2-${i}`))),
      row('drew on parses', refs(answer.provenance.parse_ids.map((i) => `parsed-${i}`))),
      h('div', { class: 'k' }, answer.summary),
    ];
  }

  function renderInspector() {
    const id = state.selected;
    if (!id || !state.nodes.has(id)) return;
    const [kind] = splitId(id);
    inspector.setAttribute('aria-label', nodeName(id));
    inspector.classList.toggle('wide', kind === 'schema');
    fill(
      inspector,
      h(
        'div',
        { class: 'insp-head' },
        h('div', { class: 'insp-title' }, h('span', { class: kind === 'answer' ? 'g accent' : 'g' }, '● '), nodeName(id)),
        h('button', { class: 'btn', type: 'button', id: 'inspector-close', onclick: () => closeInspector(true) }, 'esc'),
      ),
      inspectorBody(id),
    );
    positionInspector();
  }

  // Selecting an answer that has landed also lights it.
  function openInspector(id, { focus = false } = {}) {
    if (splitId(id)[0] === 'answer' && landed(id)) lightAnswer(state.run, id);
    state.selected = id;
    inspector.hidden = false;
    inspector.scrollTop = 0;
    renderInspector();
    refreshHighlight();
    if (focus) inspector.focus({ preventScroll: true });
  }

  function closeInspector(restoreFocus = false) {
    if (inspector.hidden) return;
    const had = inspector.contains(document.activeElement);
    const node = state.nodes.get(state.selected);
    inspector.hidden = true;
    state.selected = null;
    refreshHighlight();
    if (restoreFocus && had && node) node.el.focus({ preventScroll: true });
  }

  function positionInspector() {
    if (inspector.hidden) return;
    if (state.inspectorDroppedAt) return placeInspector(state.inspectorDroppedAt);
    const node = state.nodes.get(state.selected);
    if (!node) return;
    const w = inspector.offsetWidth;
    const halfW = (node.el.offsetWidth / 2) * view.k;
    const cx = view.x + node.x * view.k;
    const cy = view.y + node.y * view.k;
    let left = cx + halfW + POPOVER_GAP;
    if (left + w > panel.clientWidth - POPOVER_MARGIN) left = cx - halfW - POPOVER_GAP - w;
    placeInspector({ left, top: cy - iconHalf(node.kind) * view.k - 6 });
  }

  function placeInspector({ left, top }) {
    const maxLeft = panel.clientWidth - inspector.offsetWidth - POPOVER_MARGIN;
    const maxTop = panel.clientHeight - inspector.offsetHeight - POPOVER_MARGIN;
    inspector.style.left = `${clamp(left, POPOVER_MARGIN, Math.max(POPOVER_MARGIN, maxLeft))}px`;
    inspector.style.top = `${clamp(top, POPOVER_MARGIN, Math.max(POPOVER_MARGIN, maxTop))}px`;
  }

  function jumpTo(id) {
    const node = state.nodes.get(id);
    if (!node) return;
    const pw = panel.clientWidth;
    const ph = panel.clientHeight;
    const sx = view.x + node.x * view.k;
    const sy = view.y + node.y * view.k;
    if (sx < JUMP_MARGIN || sx > pw - JUMP_MARGIN || sy < JUMP_MARGIN || sy > ph - JUMP_MARGIN) {
      view.x = pw / 2 - node.x * view.k;
      view.y = ph / 2 - node.y * view.k;
      state.userMoved = true;
      glide();
      applyView();
    }
    openInspector(id);
    node.el.focus({ preventScroll: true });
  }

  // ---------- chat ----------

  function line(kind, text, { node = null, glyph = null, dim = false } = {}) {
    const g = glyph ?? { sub: '⎿', user: '›', spin: '✻' }[kind] ?? '●';
    const classes = `line ${kind}${node ? ' link' : ''}${dim ? ' dim' : ''}`;
    return h(
      node ? 'button' : 'div',
      { class: classes, type: node ? 'button' : null, onclick: node ? () => jumpTo(node) : null },
      h('span', { class: 'g', 'aria-hidden': 'true' }, g),
      h('span', { class: 't' }, text),
    );
  }

  let scrollQueued = false;

  // Once a frame at most: reading scrollHeight lays the page out.
  function scrollTranscript() {
    if (scrollQueued) return;
    scrollQueued = true;
    requestAnimationFrame(() => {
      scrollQueued = false;
      transcript.scrollTop = transcript.scrollHeight;
    });
  }

  function narrator(body, { status = true } = {}) {
    let spinner = null;
    const named = new Map();
    const say = (kind, text, opts) => {
      const el = line(kind, text, opts);
      body.insertBefore(el, spinner);
      scrollTranscript();
      return el;
    };
    return {
      say,
      // Says a line once under `name`; saying it again rewrites it in place.
      sayAs(name, kind, text, opts) {
        const said = named.get(name);
        if (said) said.querySelector('.t').textContent = text;
        else named.set(name, say(kind, text, opts));
      },
      phase(text) {
        if (!spinner) {
          spinner = line('spin', text);
          body.append(spinner);
        } else {
          spinner.querySelector('.t').textContent = text;
        }
        if (status) setStatus(`running · ${text}`);
        scrollTranscript();
      },
      done() {
        spinner?.remove();
        spinner = null;
      },
    };
  }

  function addTurn(question) {
    const body = h('div', { class: 'turn-body' });
    transcript.append(h('div', { class: 'turn' }, line('user', question), body));
    scrollTranscript();
    return { body, question };
  }

  // The status is a live region, so rewriting it unchanged, as on each keystroke, would talk over the user.
  function setStatus(...content) {
    const text = content.map((part) => (typeof part === 'string' ? part : part.textContent)).join('');
    if ($('run-status').textContent !== text) $('run-status').replaceChildren(...content);
  }

  const errorStatus = (text) => setStatus(h('span', { class: 'err' }, '● '), text);
  const sayError = (narr, text) => narr.say('main', h('span', { class: 'err' }, text));

  function doneStatus(run) {
    setStatus(h('span', { class: run.simulated ? 'flag' : 'ok' }, '● '), `done · ${runSummary(run)}`);
  }

  function readyStatus() {
    if (state.run) return;
    if (connectionProblem) return errorStatus(connectionProblem);
    setStatus(`${plural(state.files.length, 'document')} ready · ${mode.nextRun(questionEl.value.trim())}`);
  }

  // The run on the panel is still going: live, until its events end; in the prototype, until its answer lands.
  const runGoing = () => mode.runGoing();
  // A question can ask over the run on the panel once its answer has landed and the run has ended.
  const canAsk = () => landed('answer') && !runGoing();
  // Enter asks once there is a run to ask over, or one going; before any run, or after a failed one, it runs.
  const primaryAction = () => (canAsk() || runGoing() ? 'ask' : 'run');

  function updateComposer() {
    const asks = canAsk();
    const pending = state.files.filter(isPending).length;
    $('run-btn').textContent = asks ? 'ask ⏎' : 'run ⏎';
    $('new-run-btn').hidden = !asks;
    const note = $('ask-note');
    const one = pending === 1;
    note.textContent = asks && pending ? `${plural(pending, 'new document')} ${one ? "isn't" : "aren't"} in this run · new run to include ${one ? 'it' : 'them'}` : '';
    note.hidden = !note.textContent;
  }

  function updateHint() {
    const pending = state.files.filter(isPending).length;
    const hint = $('panel-hint');
    if (!state.run) hint.textContent = `${plural(state.files.length, 'document')} · ready to run`;
    else hint.textContent = pending ? `${plural(pending, 'new document')} · not run yet` : '';
    hint.hidden = !hint.textContent;
  }

  // `action` is ask, over the run on the panel, or run, a new one over the files.
  function submitQuestion(action) {
    const question = questionEl.value.trim();
    if (!question) {
      questionEl.focus();
      return;
    }
    const asks = action === 'ask';
    // An ask needs only the run's representation; a run needs files.
    const refused = asks || state.files.length ? refusal(question, asks) : null;
    if (refused) {
      setStatus(refused);
      if (refused === TYPE_A_MODEL) $('model-other').focus();
      return;
    }
    if (asks) {
      mode.ask(question);
    } else if (!state.files.length) {
      narrator(addTurn(question).body, { status: false }).say('main', 'Add files in the files tab first, then ask again.', { dim: true });
    } else {
      startRun(question);
    }
    questionEl.value = '';
    updateComposer();
  }

  // Why the question can't be sent yet, if it can't; it then stays in the box.
  function refusal(question, asks) {
    if (asks && runGoing()) return ASK_WHEN_DONE;
    if (!asks && streaming('run')) return RUN_STILL_GOING;
    if (!asks && streaming('ask')) return ASK_STILL_GOING;
    if (!pickedModel() && mode.needsModel(question, asks)) return TYPE_A_MODEL;
    return asks ? null : mode.refuseFiles(state.files);
  }

  // ---------- replay ----------

  function cancelTimers() {
    state.timers.forEach(clearTimeout);
    state.timers = [];
  }

  function stage(at, t0, order, n, appear, settle, pace = PACE.model) {
    const spread = TIMING.maxStageSpread / Math.max(1, n - 1);
    const appearGap = Math.min(pace.appearStagger, spread);
    const settleGap = Math.min(pace.settleStagger, spread);
    for (let i = 0; i < n; i++) at(t0 + i * appearGap, () => appear(i));
    let last = t0;
    order.forEach((doc, rank) => {
      last = Math.max(last + TIMING.minSettleGap, t0 + pace.settleFirst + rank * settleGap, t0 + doc * appearGap + pace.minWork);
      at(last, () => settle(doc, rank));
    });
    return last;
  }

  const idLabel = (run, id) => docLabel(run, splitId(id)[1]);
  const drewOn = (run, id) => `drew on ${cites(run, id).map((c) => idLabel(run, c)).join(', ')}`;

  function roundTwoLine(run, i) {
    const name = docLabel(run, i);
    if (!run.r2[i].summary) return `round 2 · ${name} — nothing relevant`;
    if (!cites(run, `r2-${i}`).length) return `round 2 · ${name} — cites no other document`;
    return `round 2 · ${name} — ${drewOn(run, `r2-${i}`)}`;
  }

  function parseLine(run, i) {
    const count = recordCount(run.parsed[i]);
    return `${docLabel(run, i)} — ${count ? plural(count, 'record') : 'no records'}${cites(run, `parsed-${i}`).length ? ` · ${drewOn(run, `parsed-${i}`)}` : ''}`;
  }

  function answerCiteLines(run, { summary_ids, parse_ids }) {
    const view = (label, id) => h('button', { class: 'ref', type: 'button', onclick: () => jumpTo(id) }, label);
    return [...new Set([...summary_ids, ...parse_ids])].map((d) => {
      const views = [summary_ids.includes(d) && view('summary', `r2-${d}`), parse_ids.includes(d) && view('parse', `parsed-${d}`)].filter(Boolean);
      return [`drew on ${docLabel(run, d)} · `, views.flatMap((v, k) => (k ? [' and ', v] : [v]))];
    });
  }

  function inputsOf(run, id) {
    const [kind, i] = splitId(id);
    const every = (step, keep = () => true) => range(run.docs.length).filter(keep).map((j) => `${step}-${j}`);
    if (kind === 'r2') return every('r1', (j) => j !== i && run.r1[j].summary);
    if (kind === 'parsed' || kind === 'schema') return every('r2');
    if (kind === 'answer') return [...every('r2'), ...every('parsed', (j) => recordCount(run.parsed[j]))];
    return [];
  }

  // Dotted: the call's own document, read again; faint: the other outputs it was shown.
  function showInputs(run, to) {
    const own = ownDocument(run, to);
    if (own) addEdge(own, to, 'self', 'fade');
    for (const from of inputsOf(run, to)) addEdge(from, to, 'context', 'fade');
  }

  function showCites(run, to) {
    for (const from of cites(run, to)) addEdge(from, to, 'cite', 'draw');
  }

  // ---------- drawing a run ----------
  // A replay's timeline and a live run's events both draw through these, so the two look the same.

  const hasNodes = (kind) => [...state.nodes.values()].some((n) => n.kind === kind);
  const settledCount = (kind) => [...state.nodes.values()].filter((n) => n.kind === kind && !n.el.classList.contains('working')).length;
  // Round 2's first line, rewritten once every document is through it.
  const ROUND_TWO_HEAD = 'round 2 head';

  function stageProgress(kind, n) {
    return kind === 'schema' || kind === 'answer' ? STAGE_PHASE[kind] : `${STAGE_PHASE[kind]} · ${settledCount(kind)} of ${n}`;
  }

  function beginStage(run, narr, kind) {
    const n = run.docs.length;
    const heads = {
      r1: 'round 1 · one summary per document',
      r2: 'round 2 · each document beside the other summaries',
      schema: STAGE_PHASE.schema,
      parsed: `parsing ${plural(n, 'document')}`,
    };
    if (kind === 'r2') narr.sayAs(ROUND_TWO_HEAD, 'main', heads.r2);
    else if (heads[kind]) narr.say('main', heads[kind]);
    narr.phase(stageProgress(kind, n));
  }

  function appear(run, id) {
    const [kind, i] = splitId(id);
    addNode(id);
    if (kind === 'r1') return addEdge(docId(run.docs[i]), id, 'flow', 'draw');
    if (kind === 'parsed') addEdge('schema', id, 'flow', 'draw');
    showInputs(run, id);
  }

  function isVoid(run, id) {
    const [kind, i] = splitId(id);
    if (kind === 'r1' || kind === 'r2') return !run[kind][i].summary;
    return kind === 'parsed' && !recordCount(run.parsed[i]);
  }

  function settledLine(run, id) {
    const [kind, i] = splitId(id);
    if (kind === 'r1') return `round 1 · ${docLabel(run, i)} — ${run.r1[i].summary ? 'summary ready' : 'nothing relevant'}`;
    if (kind === 'r2') return roundTwoLine(run, i);
    if (kind === 'parsed') return parseLine(run, i);
    return schemaClasses(run.schema.code).join(', ') || 'structure ready';
  }

  // Draws a node's call as finished; again, for a document read in parts, as each later part adds to it.
  function settle(run, narr, id) {
    const [kind] = splitId(id);
    const n = run.docs.length;
    settleNode(id, { empty: isVoid(run, id) });
    showCites(run, id);
    narr.sayAs(id, 'sub', settledLine(run, id), { node: id });
    narr.phase(stageProgress(kind, n));
    if (kind !== 'r2' || settledCount('r2') < n) return;
    const citing = range(n).filter((i) => cites(run, `r2-${i}`).length).length;
    narr.sayAs(ROUND_TWO_HEAD, 'main', `round 2 · ${citing} ${citing === 1 ? 'summary cites' : 'summaries cite'} another document`);
  }

  function sayAnswer(run, narr, answer, node = null) {
    narr.say('answer', answer.text, { node });
    const citeLines = answerCiteLines(run, answer.provenance);
    for (const text of citeLines) narr.say('sub', text);
    if (!citeLines.length) narr.say('sub', 'cites no document');
  }

  // An answer's node settles, with solid lines from what it cites.
  function drawAnswer(run, id) {
    settleNode(id);
    showCites(run, id);
  }

  function showAnswer(run, narr, id = 'answer') {
    drawAnswer(run, id);
    narr.done();
    const answer = answerOf(run, id);
    if (answer.simulated) narr.say('main', h('span', { class: 'flag' }, SIMULATED_LABEL));
    sayAnswer(run, narr, answer, id);
    updateComposer();
  }

  function finishRun(run, narr) {
    narr.say('sub', runSummary(run));
    doneStatus(run);
    if (state.selected === 'answer') renderInspector();
  }

  // Marks every node still working as stopped; with no answer, the next question starts a new run.
  function failRun(narr, text) {
    narr.done();
    for (const node of state.nodes.values()) {
      if (node.el.classList.contains('working')) settleNode(node.id, { failed: true });
    }
    sayError(narr, text);
    errorStatus(text);
  }

  function buildTimeline(run, narr) {
    const steps = [];
    const at = (t, fn) => steps.push({ at: t, run: fn });
    const n = run.docs.length;
    const perDocument = (t0, kind) => stage(at, t0, run.order[kind], n, (i) => appear(run, `${kind}-${i}`), (i) => settle(run, narr, `${kind}-${i}`));
    let t = TIMING.start;

    at(t, () => {
      narr.say('main', `reading ${plural(n, 'document')}`);
      if (run.simulated) {
        narr.say('sub', h('span', { class: 'flag' }, `simulated · each summary is the file's first ${SUMMARY_CHARS} characters, and the citations are made up`));
      }
      narr.phase(`reading · 0 of ${n}`);
    });
    const docAt = (i) => docId(run.docs[i]);
    t = stage(at, t, range(n), n, (i) => markWorking(docAt(i)), (i, rank) => {
      settleNode(docAt(i));
      narr.phase(`reading · ${rank + 1} of ${n}`);
    }, PACE.read);
    at(t, () => narr.say('sub', `read ${plural(n, 'file')} · ${fmtBytes(totalBytes(run.docs))}`));

    for (const kind of ['r1', 'r2']) {
      t += TIMING.phaseGap;
      at(t, () => beginStage(run, narr, kind));
      t = perDocument(t, kind);
    }

    t += TIMING.phaseGap;
    at(t, () => {
      beginStage(run, narr, 'schema');
      appear(run, 'schema');
    });
    t += TIMING.schemaWork;
    at(t, () => settle(run, narr, 'schema'));

    t += TIMING.phaseGap;
    at(t, () => beginStage(run, narr, 'parsed'));
    t = perDocument(t, 'parsed');

    t += TIMING.phaseGap;
    at(t, () => {
      beginStage(run, narr, 'answer');
      appear(run, 'answer');
    });
    t += TIMING.answerWork;
    at(t, () => {
      showAnswer(run, narr);
      finishRun(run, narr);
      run.answers.forEach((_, k) => redrawAsk(run, askId(k)));
      if (!run.simulated) offerRecordedAsks(narr);
    });
    t += TIMING.litDelay;
    at(t, () => lightRun(run));
    return steps;
  }

  function playTimeline(run, narr) {
    $('replay-btn').hidden = false;
    const steps = buildTimeline(run, narr);
    if (reduceMotion()) {
      steps.sort((a, b) => a.at - b.at).forEach((s) => s.run());
      return;
    }
    for (const s of steps) state.timers.push(setTimeout(s.run, s.at));
  }

  // ---------- live ----------

  // Fills in `run` from one of its events and draws it.
  function drawEvent(run, narr, event) {
    const doc = (id) => docIndices(run, [id])[0];
    switch (event.type) {
      case 'run_started':
        if (event.rounds !== ROUNDS) throw new Error(`this page draws ${ROUNDS} relevance rounds, and r3con-app is set to ${event.rounds}`);
        run.ids = event.document_ids;
        narr.say('main', `sent ${plural(run.docs.length, 'document')} to r3con · ${fmtBytes(totalBytes(run.docs))}`);
        break;
      case 'relevance_started':
        if (!hasNodes(`r${event.round}`)) beginStage(run, narr, `r${event.round}`);
        appear(run, `r${event.round}-${doc(event.doc_id)}`);
        break;
      case 'relevance_finished':
        addSnippet(run, narr, `r${event.round}-${doc(event.doc_id)}`, event.summary, docIndices(run, event.provenance));
        break;
      case 'schema_started':
      case 'reasoning_started': {
        const kind = event.type === 'schema_started' ? 'schema' : 'answer';
        beginStage(run, narr, kind);
        appear(run, kind);
        break;
      }
      case 'schema_finished':
        run.schema = { code: event.schema_code, thought: event.thought };
        settle(run, narr, 'schema');
        break;
      case 'parsing_started':
        if (!hasNodes('parsed')) beginStage(run, narr, 'parsed');
        appear(run, `parsed-${doc(event.doc_id)}`);
        break;
      case 'parsing_finished':
        run.parsed[doc(event.doc_id)] = { n_records: event.n_records, provenance: docIndices(run, event.provenance) };
        settle(run, narr, `parsed-${doc(event.doc_id)}`);
        break;
      case 'reasoning_finished':
        run.answer = { text: event.answer, provenance: provenanceOf(run, event.provenance) };
        showAnswer(run, narr);
        break;
      case 'run_finished':
        run.totals = totalsOf(event);
        finishRun(run, narr);
        lightRun(run);
        break;
      case 'run_failed':
        failRun(narr, [event.stage ? `failed in ${event.stage}` : 'failed', event.error].join(' · '));
        break;
    }
  }

  // A document read in parts finishes once per part: each adds to its node, drawn again from all of them.
  function addSnippet(run, narr, id, summary, provenance) {
    const [kind, i] = splitId(id);
    const earlier = run[kind][i] ?? { summary: '', provenance: [] };
    run[kind][i] = {
      summary: [earlier.summary, summary].filter(Boolean).join('\n\n'),
      provenance: [...new Set([...earlier.provenance, ...provenance])],
    };
    settle(run, narr, id);
  }

  // No new run starts while a stream is open, so the panel's run is this one until it ends.
  async function streamRun(run, narr) {
    const stream = openStream('run');
    narr.phase('starting');
    try {
      const body = { question: run.question, model: run.model, documents: run.docs.map((f) => f.text) };
      const started = await api('/api/runs', { method: 'POST', body });
      run.id = (await started.json()).run_id;
      await follow(`/api/runs/${run.id}/events`, (event) => drawEvent(run, narr, event));
    } catch (error) {
      failRun(narr, explain(error, error.message, 'the live run stopped'));
    } finally {
      closeStream(stream);
    }
  }

  // An ask runs only reasoning, over what the run built; its node waits in the answer column until it lands.
  async function askOver(run, question, model) {
    const ask = { question, model, source: 'live', text: null, provenance: null, totals: null };
    const narr = narrator(addTurn(question).body, { status: false });
    const id = addAsk(run, ask);
    const failed = (text) => {
      narr.done();
      if (!landed(id)) settleNode(id, { failed: true });
      sayError(narr, text);
    };
    const onEvent = (event) => {
      if (event.type === 'reasoning_finished') {
        Object.assign(ask, { text: event.answer, provenance: provenanceOf(run, event.provenance) });
        showAnswer(run, narr, id);
        lightLanded(run, id);
      }
      if (event.type === 'ask_finished') {
        ask.totals = totalsOf(event);
        narr.say('sub', askSummary(ask));
        if (state.selected === id) renderInspector();
      }
      if (event.type === 'ask_failed') failed(`${askSummary(ask)} · failed · ${event.error}`);
    };
    const stream = openStream('ask');
    narr.phase(`asking · ${model}`);
    try {
      const asked = await api(`/api/runs/${run.id}/asks`, { method: 'POST', body: { question, model } });
      await follow(`/api/asks/${(await asked.json()).ask_id}/events`, onEvent);
    } catch (error) {
      failed(explain(error, error.message, 'the ask stopped'));
    } finally {
      closeStream(stream);
    }
  }

  function playRun(run) {
    cancelTimers();
    const docPositions = new Map([...state.nodes.values()].filter((n) => n.kind === 'doc').map((n) => [n.id, { x: n.x, y: n.y }]));
    clearPanel();
    state.run = run;
    // Each call is shown about one input per document, so faint lines grow as n²; fading them keeps the grey steady.
    panel.style.setProperty('--context-fade', Math.min(1, FAINT_FADE_FROM_DOCS / run.docs.length));
    state.runTurn.body.replaceChildren();
    state.userMoved = false;
    syncDocNodes({ at: docPositions, animate: true, replan: true });
    mode.play(run, narrator(state.runTurn.body));
    updateComposer();
  }

  // The chat's links name nodes by id, which a new run reuses: the old run's go inert, and its offers of
  // recorded asks go.
  function retireTurns() {
    for (const offer of transcript.querySelectorAll('[data-offer]')) offer.remove();
    for (const button of transcript.querySelectorAll('button')) button.disabled = true;
  }

  function startRun(question) {
    retireTurns();
    // A run's answers to later questions, and which of its answers is lit.
    const run = Object.assign(mode.newRun(question), { answers: [], lit: null });
    state.runTurn = addTurn(question);
    playRun(run);
  }

  // ---------- asks ----------
  // An ask answers again over the run's representation; its answer node joins the run's in the answer column.

  // Adds `ask` to the run and draws its node, working, stacked around the run's answer where that is now;
  // returns the node's id.
  function addAsk(run, ask) {
    const k = run.answers.push(ask) - 1;
    const id = askId(k);
    state.layout.set(id, askSpot(state.nodes.get('answer'), k));
    addNode(id);
    if (!state.userMoved) fit(true);
    return id;
  }

  // Draws a landed ask again, as a replay does, without saying it in the chat again.
  function redrawAsk(run, id) {
    addNode(id);
    drawAnswer(run, id);
  }

  // Shifted per ask, so that each simulated answer cites other documents than the last.
  function simulatedAsk(run, question, model) {
    return { question, model, source: 'simulated', ...madeUpAnswer(run, question, run.answers.length + 1), totals: null };
  }

  // The prototype answers from a recorded ask when one has this question and model over the recorded
  // run, else with a simulated one; either lands at once.
  function prototypeAsk(run, question, model) {
    const recorded = !run.simulated && RECORDED_ASKS.find((entry) => entry.question === question && entry.model === model);
    const ask = recorded ? { ...recorded, source: 'recorded' } : simulatedAsk(run, question, model);
    const narr = narrator(addTurn(question).body, { status: false });
    const id = addAsk(run, ask);
    showAnswer(run, narr, id);
    narr.say('sub', askSummary(ask));
    lightLanded(run, id);
  }

  // After the recorded replay, each recorded ask is a click away: it fills the question and picks its model.
  function offerRecordedAsks(narr) {
    const offer = (ask) => h('button', { class: 'ref', type: 'button', onclick: () => prepareAsk(ask) }, `${ask.question} · ${bareModel(ask.model)}`);
    const lines = [
      narr.say('main', 'recorded asks over this run · any other question or model is simulated', { dim: true }),
      ...RECORDED_ASKS.map((ask) => narr.say('sub', offer(ask))),
    ];
    for (const el of lines) el.dataset.offer = '';
  }

  function prepareAsk({ question, model }) {
    const listed = [...$('model-pick').options].some((option) => option.value === model);
    $('model-pick').value = listed ? model : '';
    if (!listed) $('model-other').value = model;
    onPick();
    questionEl.value = question;
    questionEl.focus();
  }

  // ---------- files ----------

  function showTab(name) {
    for (const tab of ['chat', 'files']) {
      $(`tab-${tab}`).setAttribute('aria-selected', String(tab === name));
      $(`${tab}-pane`).hidden = tab !== name;
    }
  }

  function renderFiles() {
    $('files-head').textContent = `${plural(state.files.length, 'document')} · ${fmtBytes(totalBytes(state.files))} · ${filesAreSample() ? 'sample memos' : 'your files'}`;
    $('file-list').replaceChildren(
      ...state.files.map((f) =>
        h('li', {}, h('button', { class: 'file', type: 'button', onclick: () => openFile(f) }, h('span', { class: 'name' }, f.name), h('span', { class: 'size' }, fmtBytes(f.size)))),
      ),
    );
    $('files-count').textContent = state.files.length;
    $('sample-btn').hidden = filesAreSample();
  }

  function openFile(file) {
    showTab('files');
    const fileView = $('file-view');
    const node = state.nodes.get(docId(file));
    fill(
      fileView,
      h('button', { class: 'btn back', type: 'button', id: 'file-back', onclick: closeFile }, '‹ all files'),
      h('div', { class: 'insp-title' }, h('span', { class: 'g' }, '● '), file.name),
      h('div', { class: 'k' }, fileMeta(file)),
      fileText(file),
      node ? h('button', { class: 'btn back', type: 'button', onclick: () => jumpTo(node.id) }, 'show in panel ›') : null,
    );
    $('file-list-view').hidden = true;
    fileView.hidden = false;
    fileView.scrollTop = 0;
  }

  function closeFile() {
    $('file-view').hidden = true;
    $('file-list-view').hidden = false;
  }

  function readText(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result));
      reader.onerror = () => resolve('');
      reader.readAsText(mode.readable(file));
    });
  }

  async function addFiles(list) {
    const picked = [...list].filter((f) => f && !f.name.startsWith('.')).slice(0, MAX_FILES);
    const error = $('files-error');
    if (!picked.length) {
      error.textContent = 'No files found there. Try picking the files themselves.';
      error.hidden = false;
      return;
    }
    error.hidden = true;
    const read = await Promise.all(picked.map(async (f) => withUid({ name: f.name, size: f.size, text: await readText(f), sample: false })));
    read.sort((a, b) => a.name.localeCompare(b.name));
    state.files = filesAreSample() ? read : [...state.files, ...read].slice(0, MAX_FILES);
    const docs = plural(state.files.length, 'document');
    const next = canAsk() ? `A new run would cover ${docs}; ask stays on this run.` : `Your next question runs over ${docs}.`;
    filesChanged(`${plural(read.length, 'file')} added. ${next}`);
  }

  function useSample() {
    state.files = SAMPLE_FILES;
    if (!questionEl.value.trim()) questionEl.value = SAMPLE.question;
    filesChanged('Back to the 5 sample memos.');
  }
