  function filesChanged(message) {
    closeFile();
    renderFiles();
    updateComposer();
    syncDocNodes();
    readyStatus();
    transcript.append(line('main', message, { dim: true }));
    scrollTranscript();
  }

  async function filesFromDrop(dataTransfer) {
    const entries = [...dataTransfer.items].map((item) => item.webkitGetAsEntry?.()).filter(Boolean);
    if (!entries.length) return [...dataTransfer.files];
    const files = [];
    const walk = async (entry) => {
      if (entry.isFile) {
        files.push(await new Promise((resolve) => entry.file(resolve, () => resolve(null))));
        return;
      }
      const reader = entry.createReader();
      for (;;) {
        const batch = await new Promise((resolve) => reader.readEntries(resolve, () => resolve([])));
        if (!batch.length) return;
        for (const child of batch) await walk(child);
      }
    };
    for (const entry of entries) await walk(entry);
    return files;
  }

  // ---------- theme ----------

  function currentTheme() {
    return root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }

  function updateThemeLabel() {
    $('theme-btn').textContent = `theme · ${currentTheme()}`;
  }

  function toggleTheme() {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    writeStored(THEME_KEY, next);
    updateThemeLabel();
  }

  function restoreTheme() {
    const saved = readStored(THEME_KEY);
    if (saved === 'light' || saved === 'dark') root.dataset.theme = saved;
    updateThemeLabel();
  }

  // ---------- keys ----------

  // The prototype only notes which providers were given a key; r3con-app keeps the keys themselves.
  const keyed = new Set();

  function renderKeys(providers) {
    for (const provider of Object.keys(PROVIDERS)) {
      $(`state-${provider}`).textContent = providers.includes(provider) ? 'set' : '';
    }
    renderPicker(providers);
    readyStatus();
  }

  async function refreshKeys() {
    renderKeys(await mode.providersWithKeys());
  }

  // ---------- model picker ----------

  function pickedModel() {
    return $('model-pick').value || $('model-other').value.trim();
  }

  // The remembered model stays listed without its key, as after a reload; a chosen "other model…" stays chosen.
  function renderPicker(providers) {
    const select = $('model-pick');
    const remembered = readStored(MODEL_KEY) || DEFAULT_MODEL;
    const groups = Object.entries(PROVIDERS)
      .filter(([provider, { models }]) => models.length && providers.includes(provider))
      .map(([, group]) => group);
    const listed = groups.flatMap(({ models }) => models);
    const current = select.options.length ? select.value : remembered;
    const option = (value, text = value) => h('option', { value }, text);
    const optgroup = ({ label, models }) => h('optgroup', { label }, models.map((model) => option(model)));
    const typed = current === '' ? $('model-other').value.trim() : '';
    const unlisted = listed.includes(remembered) || remembered === typed ? null : option(remembered);
    fill(select, unlisted, groups.map(optgroup), option('', 'other model…'));
    select.value = current === '' || listed.includes(current) ? current : remembered;
    $('model-hint').hidden = providers.length > 0;
    showOtherModel();
  }

  function showOtherModel() {
    const other = $('model-other');
    other.hidden = other.disabled = $('model-pick').value !== '';
  }

  function onPick() {
    showOtherModel();
    const model = pickedModel();
    if (model) writeStored(MODEL_KEY, model);
    readyStatus();
  }

  // ---------- settings ----------

  function keyField(provider, props) {
    return h('input', {
      class: 'field key',
      id: `key-${provider}`,
      type: 'password',
      autocomplete: 'new-password',
      'data-1p-ignore': true,
      'data-lpignore': 'true',
      spellcheck: 'false',
      autocapitalize: 'off',
      ...props,
    });
  }

  function endpointField(props) {
    return h('input', {
      class: 'field',
      id: 'endpoint-other',
      form: 'settings-form',
      type: 'text',
      inputmode: 'url',
      pattern: 'https?://\\S+',
      title: 'starts with http:// or https://',
      spellcheck: 'false',
      autocapitalize: 'off',
      placeholder: 'http://localhost:8000/v1',
      ...props,
    });
  }

  // A row is a label, a field and the provider's state; Other's field is its endpoint, with its key below.
  function keyRows() {
    return Object.entries(PROVIDERS).flatMap(([provider, { label }], i) => {
      const marker = h('span', { class: 'k', id: `state-${provider}` });
      if (provider !== OTHER) {
        const key = keyField(provider, { autofocus: i === 0, 'aria-describedby': marker.id });
        return [h('label', { for: key.id }, label), key, marker];
      }
      const endpoint = endpointField({ 'aria-label': `${label}: server URL`, 'aria-describedby': `${marker.id} other-hint` });
      const key = keyField(provider, { placeholder: 'key, if it needs one', 'aria-label': `${label}: key` });
      return [h('label', { for: endpoint.id }, label), endpoint, marker, key];
    });
  }

  function buildSettings() {
    fill($('keys'), keyRows());
    $('keys-show').setAttribute('aria-controls', Object.keys(PROVIDERS).map((provider) => `key-${provider}`).join(' '));
  }

  function showKeys(show) {
    for (const input of document.querySelectorAll('.key')) input.type = show ? 'text' : 'password';
    $('keys-show').textContent = show ? 'hide keys' : 'show keys';
  }

  function clearSettings() {
    for (const input of $('settings').querySelectorAll('input')) input.value = '';
    $('endpoint-other').required = false;
    showKeys(false);
  }

  // Right-aligned under the button; CSS owns the width, so nothing needs measuring before it opens.
  function placeSettings() {
    const button = $('settings-btn').getBoundingClientRect();
    const popover = $('settings');
    popover.style.left = `max(var(--gutter), ${button.right}px - var(--settings-width))`;
    popover.style.top = `${button.bottom + POPOVER_GAP}px`;
    popover.style.maxHeight = `${window.innerHeight - button.bottom - POPOVER_GAP - POPOVER_MARGIN}px`;
  }

  // beforetoggle, not toggle, so the popover is placed and cleared before its first paint.
  function onSettingsToggle(e) {
    clearSettings();
    if (e.newState !== 'open') return;
    placeSettings();
    showSaveResult('');
  }

  let savedTimer = 0;

  function showSaveResult(text) {
    clearTimeout(savedTimer);
    $('settings-saved').textContent = text;
  }

  function clearKey(provider) {
    $(`key-${provider}`).value = '';
    if (provider !== OTHER) return;
    $('endpoint-other').value = '';
    $('endpoint-other').required = false;
  }

  let saving = false;

  // A save asked for while one is in flight is dropped: it would send the same keys again.
  async function saveSettings() {
    if (saving) return;
    saving = true;
    try {
      await saveEnteredKeys();
    } finally {
      saving = false;
    }
  }

  // Other is entered once it has an endpoint. Keys are saved one at a time, each field cleared once
  // its key is saved and the markers following each answer; a failure stops the save, and the fields
  // left keep what was typed until they close.
  async function saveEnteredKeys() {
    const endpoint = $('endpoint-other').value;
    const entered = Object.keys(PROVIDERS)
      .map((provider) => [provider, $(`key-${provider}`).value.trim()])
      .filter(([provider, key]) => (provider === OTHER ? endpoint : key));
    if (!entered.length) return showSaveResult('nothing to save');
    for (const [provider, key] of entered) {
      try {
        renderKeys(await mode.saveKey(provider, key, provider === OTHER ? endpoint : undefined));
      } catch (error) {
        return showSaveResult(`${PROVIDERS[provider].label} · ${explain(error, "couldn't save", "couldn't save the keys")}`);
      }
      clearKey(provider);
    }
    clearSettings();
    showSaveResult('saved');
    savedTimer = setTimeout(() => showSaveResult(''), SAVED_MS);
  }

  // ---------- gestures ----------

  const gesture = { pointers: new Map(), mode: null, moved: false, origin: null, from: null, node: null, pinch: null };

  function panelPoint(x, y) {
    const r = panel.getBoundingClientRect();
    return { x: x - r.left, y: y - r.top };
  }

  function startPinch() {
    const [a, b] = [...gesture.pointers.values()];
    gesture.mode = 'pinch';
    gesture.pinch = { dist: Math.hypot(a.x - b.x, a.y - b.y) || 1, mid: panelPoint((a.x + b.x) / 2, (a.y + b.y) / 2), view: { ...view } };
  }

  function updatePinch() {
    const [a, b] = [...gesture.pointers.values()];
    const p = gesture.pinch;
    const k = clamp((p.view.k * Math.hypot(a.x - b.x, a.y - b.y)) / p.dist, ZOOM.min, ZOOM.max);
    const mid = panelPoint((a.x + b.x) / 2, (a.y + b.y) / 2);
    const wx = (p.mid.x - p.view.x) / p.view.k;
    const wy = (p.mid.y - p.view.y) / p.view.k;
    view.k = k;
    view.x = mid.x - wx * k;
    view.y = mid.y - wy * k;
    state.userMoved = true;
    applyView();
  }

  function onPointerDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target.closest('.inspector, .panel-tools')) return;
    gesture.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (gesture.pointers.size === 2) return startPinch();
    if (gesture.pointers.size > 2) return;
    const nodeEl = e.target.closest('.node');
    gesture.node = nodeEl ? state.nodes.get(nodeEl.dataset.id) : null;
    gesture.mode = gesture.node ? 'drag' : 'pan';
    gesture.moved = false;
    gesture.origin = { x: e.clientX, y: e.clientY };
    gesture.from = gesture.node ? drawnAt(gesture.node) : { x: view.x, y: view.y };
  }

  function onPointerMove(e) {
    const p = gesture.pointers.get(e.pointerId);
    if (!p) return;
    // A mouse released outside the panel before the gesture was captured sent its pointerup elsewhere.
    if (e.pointerType === 'mouse' && !e.buttons) return onPointerEnd(e);
    p.x = e.clientX;
    p.y = e.clientY;
    if (gesture.mode === 'pinch') return updatePinch();
    if (!gesture.mode) return;
    const dx = e.clientX - gesture.origin.x;
    const dy = e.clientY - gesture.origin.y;
    if (!gesture.moved && Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
    if (!gesture.moved) panel.setPointerCapture(e.pointerId);
    gesture.moved = true;
    if (gesture.mode === 'drag') {
      gesture.node.x = gesture.from.x + dx / view.k;
      gesture.node.y = gesture.from.y + dy / view.k;
      placeNode(gesture.node);
      redrawEdges();
      if (state.selected === gesture.node.id) positionInspector();
    } else {
      panel.classList.add('panning');
      view.x = gesture.from.x + dx;
      view.y = gesture.from.y + dy;
      state.userMoved = true;
      applyView();
    }
  }

  function onPointerEnd(e) {
    if (!gesture.pointers.delete(e.pointerId)) return;
    if (gesture.mode === 'pinch') {
      if (!gesture.pointers.size) gesture.mode = null;
      return;
    }
    if (e.type === 'pointerup' && !gesture.moved && gesture.mode === 'pan') closeInspector();
    gesture.mode = null;
    gesture.node = null;
    panel.classList.remove('panning');
  }

  function onWheel(e) {
    if (e.target.closest('.inspector')) return;
    e.preventDefault();
    const scale = e.deltaMode === 1 ? WHEEL_LINE_PX : 1;
    if (e.ctrlKey || e.metaKey) {
      const p = panelPoint(e.clientX, e.clientY);
      zoomAt(p.x, p.y, view.k * Math.exp(-e.deltaY * scale * WHEEL_ZOOM_RATE));
    } else {
      view.x -= e.deltaX * scale;
      view.y -= e.deltaY * scale;
      applyView();
    }
    state.userMoved = true;
  }

  const inspectorGrab = { x: 0, y: 0, left: 0, top: 0 };

  function onInspectorGrab(e) {
    if (!e.target.closest('.insp-head') || e.target.closest('button')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    Object.assign(inspectorGrab, { x: e.clientX, y: e.clientY, left: inspector.offsetLeft, top: inspector.offsetTop });
    inspector.setPointerCapture(e.pointerId);
  }

  function onInspectorMove(e) {
    if (!inspector.hasPointerCapture(e.pointerId)) return;
    const dx = e.clientX - inspectorGrab.x;
    const dy = e.clientY - inspectorGrab.y;
    if (!inspector.classList.contains('moving') && Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
    inspector.classList.add('moving');
    state.inspectorDroppedAt = { left: inspectorGrab.left + dx, top: inspectorGrab.top + dy };
    placeInspector(state.inspectorDroppedAt);
  }

  function hoverFrom(e) {
    const el = e.target.closest('.node');
    return el ? el.dataset.id : null;
  }

  // ---------- wiring ----------

  function wire() {
    panel.addEventListener('pointerdown', onPointerDown);
    panel.addEventListener('pointermove', onPointerMove);
    panel.addEventListener('pointerup', onPointerEnd);
    panel.addEventListener('pointercancel', onPointerEnd);
    panel.addEventListener('wheel', onWheel, { passive: false });
    inspector.addEventListener('pointerdown', onInspectorGrab);
    inspector.addEventListener('pointermove', onInspectorMove);
    inspector.addEventListener('lostpointercapture', () => inspector.classList.remove('moving'));

    nodesLayer.addEventListener('pointerover', (e) => {
      state.hovered = hoverFrom(e);
      refreshHighlight();
    });
    nodesLayer.addEventListener('pointerout', (e) => {
      if (e.relatedTarget && e.target.closest('.node')?.contains(e.relatedTarget)) return;
      state.hovered = null;
      refreshHighlight();
    });
    nodesLayer.addEventListener('focusin', (e) => {
      state.hovered = hoverFrom(e);
      refreshHighlight();
    });
    nodesLayer.addEventListener('focusout', () => {
      state.hovered = null;
      refreshHighlight();
    });
    // On click, not pointerup: a tap's click would otherwise land on the inspector that just opened under it.
    panel.addEventListener('click', (e) => {
      const id = hoverFrom(e);
      // element.click() and assistive tech send detail 0: no pointer behind them, so no drag to skip.
      const endsDrag = gesture.moved && e.detail > 0;
      if (id && !endsDrag) openInspector(id);
    });
    nodesLayer.addEventListener('keydown', (e) => {
      const id = hoverFrom(e);
      if (id && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        openInspector(id, { focus: true });
      }
    });

    document.addEventListener('keydown', (e) => {
      // The platform closes an open settings popover on this same Escape.
      if (e.key !== 'Escape' || $('settings').matches(':popover-open')) return;
      if (!inspector.hidden) closeInspector(true);
      else if (!$('file-view').hidden) closeFile();
    });

    $('arrange-btn').addEventListener('click', arrange);
    $('settings').addEventListener('beforetoggle', onSettingsToggle);
    window.addEventListener('resize', () => $('settings').matches(':popover-open') && placeSettings());
    $('settings').addEventListener('input', () => showSaveResult(''));
    $('keys-show').addEventListener('click', () => showKeys(document.querySelector('.key').type === 'password'));
    $('key-other').addEventListener('input', () => ($('endpoint-other').required = Boolean($('key-other').value.trim())));
    // The key fields sit outside the form, so Enter there doesn't submit it on its own.
    $('settings').addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || e.isComposing || !e.target.matches('.key')) return;
      e.preventDefault();
      $('settings-form').requestSubmit();
    });
    $('settings-form').addEventListener('submit', (e) => {
      e.preventDefault();
      saveSettings();
    });
    $('fit-btn').addEventListener('click', refit);
    $('replay-btn').addEventListener('click', () => state.run && playRun(state.run));
    $('theme-btn').addEventListener('click', toggleTheme);
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateThemeLabel);

    $('tab-chat').addEventListener('click', () => showTab('chat'));
    $('tab-files').addEventListener('click', () => {
      showTab('files');
      closeFile();
    });

    $('ask-form').addEventListener('submit', (e) => {
      e.preventDefault();
      submitQuestion(primaryAction());
    });
    $('new-run-btn').addEventListener('click', () => {
      submitQuestion('run');
      // It hides while its run goes, which would drop the focus to the page.
      if ($('new-run-btn').hidden) questionEl.focus();
    });
    questionEl.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
      e.preventDefault();
      if (e.ctrlKey || e.metaKey) submitQuestion('run');
      else $('ask-form').requestSubmit();
    });
    $('model-pick').addEventListener('change', onPick);
    $('model-other').addEventListener('change', onPick);
    questionEl.addEventListener('input', readyStatus);

    for (const id of ['file-input', 'folder-input']) {
      const input = $(id);
      input.addEventListener('change', () => {
        if (input.files.length) addFiles(input.files);
        input.value = '';
      });
    }
    $('sample-btn').addEventListener('click', useSample);

    const hasFiles = (e) => [...(e.dataTransfer?.types ?? [])].includes('Files');
    side.addEventListener('dragover', (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
      side.classList.add('dropping');
    });
    side.addEventListener('dragleave', (e) => {
      if (!side.contains(e.relatedTarget)) side.classList.remove('dropping');
    });
    side.addEventListener('drop', async (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      side.classList.remove('dropping');
      showTab('files');
      addFiles(await filesFromDrop(e.dataTransfer));
    });
    window.addEventListener('dragover', (e) => hasFiles(e) && e.preventDefault());
    window.addEventListener('drop', (e) => hasFiles(e) && e.preventDefault());

    new ResizeObserver(() => {
      if (!state.userMoved) fit();
      positionInspector();
    }).observe(panel);
  }

  // ---------- modes ----------
  // What differs between the page served by r3con-app and the prototype, decided once at load.

  const prototypeMode = {
    intro: PROTOTYPE_INTRO,
    note: PROTOTYPE_MODE_NOTE,
    keysNote: PROTOTYPE_KEYS_NOTE,
    nextRun: (question) => (replaysRecording(question) ? `recorded run · ${SAMPLE.model}` : `simulated run · ${pickedModel() || 'type a model'}`),
    needsModel: (question, asks) => asks || !replaysRecording(question),
    refuseFiles: () => null,
    // It shows a file's start only, so it reads no more than that.
    readable: (file) => file.slice(0, READ_BYTES),
    newRun: (question) => (replaysRecording(question) ? sampleRun() : simulatedRun(state.files, question, pickedModel())),
    play: playTimeline,
    runGoing: () => Boolean(state.run) && !landed('answer'),
    ask: (question) => prototypeAsk(state.run, question, pickedModel()),
    saveKey: async (provider) => [...keyed.add(provider)],
    providersWithKeys: async () => [...keyed],
  };

  // A provider whose variable is set where r3con-app runs counts as having a key.
  const liveMode = {
    intro: LIVE_INTRO,
    note: LIVE_MODE_NOTE,
    keysNote: LIVE_KEYS_NOTE,
    nextRun: () => pickedModel() || 'type a model',
    needsModel: () => true,
    refuseFiles: unreadableFiles,
    readable: (file) => file,
    newRun: (question) => liveRun(question, pickedModel()),
    play: streamRun,
    runGoing: () => streaming('run'),
    ask: (question) => askOver(state.run, question, pickedModel()),
    async saveKey(provider, key, endpoint) {
      const saved = await api('/api/keys', { method: 'POST', body: { provider, endpoint, key: key || undefined } });
      return keyedProviders(await saved.json());
    },
    providersWithKeys: async () => keyedProviders(await (await api('/api/keys')).json()),
  };

  // r3con refuses a blank document, so a run with one is not sent.
  function unreadableFiles(files) {
    const names = files.filter((f) => !f.text.trim()).map((f) => f.name);
    return names.length ? `no readable text in ${names.join(', ')}; nothing was sent` : null;
  }

  const mode = live ? liveMode : prototypeMode;

  function init() {
    restoreTheme();
    removeStored(RETIRED_SETTINGS_KEY);
    buildSettings();
    questionEl.value = SAMPLE.question;
    renderFiles();
    updateComposer();
    renderPicker([]);
    readyStatus();
    refreshKeys().catch((error) => errorStatus(explain(error, "couldn't read which providers have keys")));
    $('keys-note').textContent = mode.keysNote;
    $('mode-note').textContent = mode.note;
    transcript.append(line('main', mode.intro, { dim: true }));
    applyView();
    syncDocNodes();
    wire();
  }

  init();
})();
</script>
</body>
</html>
