[project]
name = "r3con-app"
version = "0.1.0"
description = "The local server that connects r3con's app to r3con."
requires-python = ">=3.11"
dependencies = [
    "r3context",
    "litellm>=1.103,<2",
    "platformdirs>=4.0",
    "pydantic>=2.11",
    "starlette>=1.10",
    "uvicorn>=0.54",
]

[project.scripts]
r3con-app = "r3con_app.server:main"

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "pyright>=1.1.414",
    "pytest>=9.0",
    "pytest-socket>=0.8",
    "ruff>=0.16",
]

[tool.uv.sources]
r3context = { path = "..", editable = true }

[tool.pyright]
include = ["src", "tests", "checks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--disable-socket", "--allow-unix-socket", "--strict-markers"]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"
